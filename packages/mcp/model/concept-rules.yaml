  # RM-reason — async-boundary. FIVE additive rules, all `concept:async-boundary`,
  # mirroring the shipped OWD 5-rule NODE pattern plus one dispatch EDGE rule. The
  # async markers are ALREADY in the graph (no engine change, no refresh): the
  # apex-class extractor emits four unconditionally-present ApexClass boolean
  # properties (`isQueueable`/`isBatchable`/`isSchedulable`/`hasFutureMethod`,
  # `declared`-tier structural facts parsed from the class's own `implements` /
  # `@future` annotation), and the apex-edges extractor emits the `dispatchesAsync`
  # edge (ApexClass -> ApexClass, `dispatchMechanism` in {enqueueJob, executeBatch,
  # schedule, future}). Each rule is a PRESENCE claim (`absenceShaped: false`) at
  # `maxConfidence: declared`; a node match carries no edge, so weakest() keeps the
  # declared ceiling on the four class-marker rules, and the edge rule honestly
  # DROPS a heuristic `future`-mechanism dispatch to heuristic via weakest().
  # HONEST BOUNDARIES, kept verbatim in each claim: the async boundary is named
  # STRUCTURALLY — none of these assert WHEN the job runs, whether it succeeds, or
  # the order of multiple async jobs relative to each other. The three class-level
  # markers (Queueable / Batch / Schedulable) mean the entry point runs async in a
  # SEPARATE transaction; @future is METHOD-level, so its rule states only the
  # method is async, never the whole class. Real-vault probe (read-only, no
  # refresh): the four node rules fire on 35 distinct async ApexClasses (Queueable
  # 5 / Batchable 17 / Schedulable 12 / @future 1, zero overlap), and the edge rule
  # fires on 19 distinct caller classes over 30 `dispatchesAsync` edges (28 declared
  # + 2 heuristic `future`); a non-async ApexClass fires none.
  - id: rule:async-boundary/queueable
    concept: concept:async-boundary
    bind:
      componentTypes:
        - ApexClass
      whereProperty:
        key: isQueueable
        equals: true
    interpretation: '{ids} implements Queueable — its execute method runs asynchronously in a SEPARATE transaction from the code that enqueues it; an async job cannot start before the enqueuing transaction commits, so its writes are not visible to the rest of that transaction, and governor limits reset at the boundary. This names the async boundary structurally; it does not assert WHEN the job runs, whether it succeeds, or its order relative to other async jobs.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - ApexClass
  - id: rule:async-boundary/batchable
    concept: concept:async-boundary
    bind:
      componentTypes:
        - ApexClass
      whereProperty:
        key: isBatchable
        equals: true
    interpretation: '{ids} implements Batch Apex — its start/execute/finish run asynchronously in a SEPARATE transaction from the code that enqueues it; an async job cannot start before the enqueuing transaction commits, so its writes are not visible to the rest of that transaction, and governor limits reset at the boundary (each batch runs in its own transaction). This names the async boundary structurally; it does not assert WHEN the job runs, whether it succeeds, or its order relative to other async jobs.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - ApexClass
  - id: rule:async-boundary/schedulable
    concept: concept:async-boundary
    bind:
      componentTypes:
        - ApexClass
      whereProperty:
        key: isSchedulable
        equals: true
    interpretation: '{ids} implements Schedulable — its execute method runs asynchronously on the scheduler in a SEPARATE transaction from the code that schedules it (registered via System.schedule at a cron time, not necessarily a record save); it cannot start before that scheduling transaction commits, its writes are not visible to it, and governor limits reset at the boundary. This names the async boundary structurally; it does not assert WHEN the job runs, whether it succeeds, or its order relative to other async jobs.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - ApexClass
  - id: rule:async-boundary/future-method
    concept: concept:async-boundary
    bind:
      componentTypes:
        - ApexClass
      whereProperty:
        key: hasFutureMethod
        equals: true
    interpretation: '{ids} contains a @future method — calls to it run asynchronously in a separate transaction; the caller does not see its results and cannot guarantee WHEN it runs. Only the annotated method is async, not the rest of the class.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
