    concept: concept:record-type-business-process-binding
    bind:
      componentTypes:
        - RecordType
      whereProperty:
        key: businessProcess
        isNull: false
    interpretation: '{ids} declares a BUSINESS PROCESS binding, so records created with this record type are scoped to that process''s ordered subset of the master status picklist — it constrains the available stage picklist values to those the bound business process exposes (the Stage / Status / Solution-status values), NOT the object''s full master picklist. On any write path — a Flow, an Apex assignment, an API create, or a data import — setting the stage / status field to a value the bound process does not include can be rejected. This names the DECLARED binding from the record type''s own businessProcess reference, NOT the specific stage values the process exposes (those live on the BusinessProcess metadata and are org-specific), NOT which records currently carry this record type or their current stage (record-level, not modeled offline), and NOT whether the bound business process is itself active. A record type without a business process uses the object''s full master picklist and has no such scoping.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - RecordType

  # APEX CODE-QUALITY BATCH — apex-dynamic-reflective-surface. anyElement over the
  # ApexClass `qualityIssues` array with `equals: dynamic-apex` (rule name grounded
  # code-quality-patterns.ts:715; detector wired at code-quality-patterns.ts:1710;
  # property written at apex-class.ts:357). `maxConfidence: heuristic` — every
  # qualityIssues element carries `confidence:'heuristic'`, and a node match carries
  # no edge, so weakest() keeps the heuristic ceiling. componentTypes [ApexClass]
  # only (qualityIssues lives on ApexClass). absenceShaped:false (presence rule).
  # Purely additive — no existing rule affected.
  - id: rule:code-quality/dynamic-reflective-surface
    concept: concept:apex-dynamic-reflective-surface
    bind:
      componentTypes:
        - ApexClass
      whereProperty:
        key: qualityIssues
        anyElement:
          key: rule
          equals: dynamic-apex
    interpretation: '{ids} uses DYNAMIC or REFLECTIVE Apex — object, field, or type references built at RUNTIME (a dynamic-query string, a runtime schema describe, reflective type instantiation by name, or untyped deserialization) rather than as static literals. Such runtime-built references are INVISIBLE to static dependency analysis, so impact, usage / where-used, and dead-code results for this class MAY BE INCOMPLETE — a real dependency can be hidden behind the runtime construction. This is HEURISTIC token recognition, NOT a compiler AST: it can FLAG a dynamic construct whose reference is actually a safe constant, and can MISS one the tokenizer does not match. It does NOT prove the class is buggy, does NOT name WHICH objects or fields the dynamic code touches, and does NOT assert any specific hidden dependency — it flags the class as one whose static analysis is blind in spots; read the source to confirm.'
    maxConfidence: heuristic
    absenceShaped: false
    dependsOnCoverage:
      - ApexClass

  # ARC-2 — named-credential-merge-fields-injectable. TWO additive NODE rules,
  # both `concept:named-credential-merge-fields-injectable`, mirroring the
  # external-api-surface class-marker NODE pattern EXACTLY. The markers are
  # ALREADY in the graph (no extractor change, no refresh, no engine change): the
  # named-credential extractor emits two unconditionally-present NamedCredential
  # boolean properties — `allowMergeFieldsInHeader` and `allowMergeFieldsInBody`
  # (named-credential.ts:207-212, default false). Each rule is a PRESENCE claim
  # (`absenceShaped: false`) at `maxConfidence: declared` — a node match carries no
  # edge, so weakest() keeps the declared ceiling. The two flags are read
  # independently, so a credential with both set surfaces both claims. HONEST
  # BOUNDARIES kept verbatim in each claim: it names the DECLARED configuration
  # that ENABLES substitution, and does NOT prove a callout uses the credential,
  # that any merge field carries UNTRUSTED input, or that an injection occurs.
  - id: rule:named-credential-merge-fields-injectable/header
    concept: concept:named-credential-merge-fields-injectable
    bind:
      componentTypes:
        - NamedCredential
      whereProperty:
        - key: allowMergeFieldsInHeader
          equals: true
    interpretation: '{ids} is a named credential with `allowMergeFieldsInHeader` = true — the default guard against merge-field substitution in the outbound HTTP HEADER is LIFTED, so Apex callouts authenticating through this credential may substitute merge fields (including record- or user-derived values) into request headers. That makes it an outbound injection surface: if a substituted value is attacker-influenced it can alter or forge headers the upstream API trusts (header injection). This names the DECLARED configuration that ENABLES substitution; it does NOT prove that any Apex actually uses this credential, that any merge field carries UNTRUSTED input (the values may be static/trusted and the setting intentional), or that an injection occurs at runtime.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - NamedCredential
  - id: rule:named-credential-merge-fields-injectable/body
    concept: concept:named-credential-merge-fields-injectable
    bind:
      componentTypes:
        - NamedCredential
      whereProperty:
        - key: allowMergeFieldsInBody
          equals: true
    interpretation: '{ids} is a named credential with `allowMergeFieldsInBody` = true — the default guard against merge-field substitution in the outbound HTTP BODY is LIFTED, so Apex callouts authenticating through this credential may substitute merge fields (including record- or user-derived values) into the request payload. That makes it an outbound injection surface: if a substituted value is attacker-influenced it can forge or tamper with body fields the upstream API trusts (payload injection). This names the DECLARED configuration that ENABLES substitution; it does NOT prove that any Apex actually uses this credential, that any merge field carries UNTRUSTED input (the values may be static/trusted and the setting intentional), or that an injection occurs at runtime.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - NamedCredential

  # ARC-2 — connected-app-saml-sso-federation. A NODE rule, componentTypes
  # [ConnectedApp] + a scalar whereProperty {key: authProtocol, in: [saml, both]}
  # over the ALWAYS-present `authProtocol` discriminant (connected-app.ts:295,
  # computed :259-266) — the SAME node shape as
  # rule:access-mechanism/connected-app-oauth-scope. `maxConfidence: declared`
  # (authProtocol is read verbatim from the app''s own metadata; a node match
  # carries no edge, so weakest() keeps the declared ceiling). An `oauth` or `none`
  # app short-circuits the `in` test to false and never fires. ORG-INDEPENDENT — NO
  # vault counts in the interpretation.
  - id: rule:access-mechanism/connected-app-saml-sso-federation
    concept: concept:connected-app-saml-sso-federation
    bind:
      componentTypes:
        - ConnectedApp
      whereProperty:
        key: authProtocol
        in:
          - saml
          - both
    interpretation: '{ids} is a connected app carrying a SAML config — a SAML SSO federation target that declares Salesforce as the SAML identity provider (IdP) and the app as an external service provider (SP) Salesforce will mint signed SAML assertions for, federating an authenticated user''s identity into that third party for single sign-on. Its authProtocol is saml (SAML only) or both (SAML alongside an OAuth client), and the declared trust boundary — the Assertion Consumer Service (ACS) URL, the SP entity / audience, the expected issuer, and the NameID / subject format — defines who Salesforce federates identities out to. So it is an identity and trust surface worth reviewing. This names the DECLARED SAML SSO federation configuration, not a proven active login: the config is a static shape, not evidence that anyone authenticates through it or that the signing certificate is valid (the key material is never vaulted), WHO may use the app is a separate profile / permission-set access layer the config does not encode, and the federation may be intentional for a trusted downstream app.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - ConnectedApp

  # apex-fake-assertion-test. anyElement over the ApexClass `qualityIssues` array with
  # `equals: fake-assertion` (rule name grounded code-quality-patterns.ts:1546; the
  # recognizer is isTest-gated at :1542 and only fires on tautology shapes at :1531-1535,
  # so a non-test or genuinely-asserting class carries no such element). Mirrors the
  # shipped rule:code-quality/hardcoded-org-specific-literal anyElement shape.
  # `maxConfidence: heuristic` — qualityIssues elements are heuristic and the node match
  # carries no edge, so weakest() keeps the heuristic ceiling. componentTypes [ApexClass]
  # only (qualityIssues lives on ApexClass). Purely additive; NO extractor/engine change.
  - id: rule:apex-fake-assertion/tautology-assertion
    concept: concept:apex-fake-assertion-test
    bind:
      componentTypes:
        - ApexClass
      whereProperty:
        key: qualityIssues
        anyElement:
          key: rule
          equals: fake-assertion
    interpretation: '{ids} is an @IsTest class that contains a TAUTOLOGICAL or self-referential assertion — a System.assert(true, ...), a System.assertEquals(x, x), or a System.assertEquals(literal, sameLiteral) — whose operands are identical or always true, so it passes no matter how the code under test behaves. That assertion verifies nothing: it cannot fail on a wrong computed value, only on an uncaught exception, yet it still executes the code under test and so inflates the org code-coverage number while providing no real regression protection, and it can mask a genuine defect behind a green run. Assert on real field values, record counts, or thrown exceptions instead. This is HEURISTIC recognition from TOKENIZED Apex source — NOT a compiler AST: it flags the tautological call-site itself and does NOT prove the whole class is worthless (the class may carry other, meaningful assertions alongside the fake one). It names a test-quality review candidate, not proven coverage fraud.'
    maxConfidence: heuristic
    absenceShaped: false
    dependsOnCoverage:
      - ApexClass

  # ARC-2 concept-expansion — entitlement-process-inactive. ONE additive NODE rule
  # over an EntitlementProcess's grounded `active` STRING property
  # (enterprise-metadata.ts:1762, extraProperties -> Record<string,string>). Fires on
  # `active === 'false'` (a STRING equals, NOT a boolean — an unquoted `false` would be
  # a YAML boolean and never === 'false'), cites the process, confidence declared.
  # The omit-when-absent shape means an <active>-absent process carries no `active` key
  # and does NOT match (we do not guess liveness). No extractor / engine / refresh change:
  # `equals` on a scalar whereProperty is already live. TIER `declared`: `active` is read
  # verbatim from the process's own metadata (zero resolution risk); a node match carries
  # no edge, so weakest() keeps the declared ceiling.
  - id: rule:entitlement-process/inactive
    concept: concept:entitlement-process-inactive
    bind:
      componentTypes:
        - EntitlementProcess
      whereProperty:
        key: active
        equals: 'false'
    interpretation: '{ids} is an INACTIVE entitlement process — its `active` flag is FALSE, so Salesforce never applies it to a case and never starts any of its milestone timers until an admin re-activates it. It is DEAD SLA automation: no milestone clock runs, no business-hours SLA countdown begins, and no entitlement-driven escalation can fire from this version while it is inactive. It must be EXCLUDED from SLA / entitlement reasoning and from "what milestones apply on save" impact counts — treating a deactivated process as a live SLA guard would cry wolf about timers that cannot start, while assuming its milestones still run would falsely imply cases are being tracked. This is the DECLARED non-running fact read from the process''s own active flag; it does NOT prove whether any specific case is currently on-track or breached (that is live per-record timer data the offline vault does not hold), NOT whether this version WOULD apply if activated (entry criteria remain unevaluated offline), and NOT whether another active version of the same process exists (version lineage is org-specific).'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - EntitlementProcess

  # ARC-2 concept-expansion — omnistudio-inactive-component-version. ONE NODE
  # rule on the three OmniStudio version types that share an always-present
  # `isActive` boolean (omniscript.ts:556, omni-integration-procedure.ts:765,
  # omni-ui-card.ts:794). A node match carries no edge, so weakest() keeps the
  # declared ceiling. ORG-INDEPENDENT — NO vault counts in the interpretation.
  - id: rule:omnistudio/inactive-component-version
    concept: concept:omnistudio-inactive-component-version
    bind:
      componentTypes:
        - OmniScript
        - OmniIntegrationProcedure
        - OmniUiCard
      whereProperty:
        key: isActive
        equals: false
    interpretation: '{ids} is an INACTIVE OmniStudio component version (an OmniScript, Integration Procedure, or FlexCard whose isActive flag is FALSE). Salesforce serves and dispatches only the ACTIVE version of an OmniStudio component, so this saved version does not execute at runtime: it is not rendered, invoked as an action, or embedded on a page until an admin activates it. It must be EXCLUDED from runtime-reachability, invocation-impact, and ''what actually runs'' reasoning about OmniStudio — treating a deactivated version as live would overstate the runtime surface. This names the non-running structural fact from the component''s own isActive flag, NOT whether another version of the same bundle is active and serving in its place (version lineage is org-specific), NOT whether anything still references this version by name, NOT what it would do if activated, and NOT why it was deactivated.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - OmniScript
      - OmniIntegrationProcedure
      - OmniUiCard

  # ARC-2 concept-expansion — rule:field/required-absent-from-all-layouts. A
  # NODE-present ANTI-JOIN (C17 shape, mirroring rule:field/deep-creation-gap-no-
  # before-save-writer): CustomField `required == true` with NO `usedInLayout` edge
  # from any Layout (correlate sameTo → absent.to === the field root, reason.ts:
  # 974-975). `required` is read verbatim from the field's declared metadata
  # (custom-field.ts:420, fixed key); `usedInLayout` edges are declared-confidence
  # (layout.ts:317). maxConfidence declared: the present side is a declared node
  # match and the absent side reasons over declared edges, so weakest() keeps the
  # declared ceiling. absenceShaped true: it concludes an absence-of-placement, so
  # under incomplete Layout coverage the absence is NOT asserted. Orthogonal to the
  # no-default / deep-creation-gap rules (default-value axis) — never double-claims.
  - id: rule:field/required-absent-from-all-layouts
    concept: concept:required-field-absent-from-all-layouts
    bind:
      componentTypes:
        - CustomField
      whereProperty:
        - key: required
          equals: true
      antiJoin:
        absentEdgeType: usedInLayout
        absentFromTypes:
          - Layout
        correlate: sameTo
    interpretation: '{ids} is UNIVERSALLY REQUIRED yet NO extracted page layout places it in any field-bearing region (the detail body, the Highlights Panel, or the mini layout) — so a user creating or editing a record through those layouts has no declared input for its value, which must instead come from a default value, a before-save automation, an Apex / API / data-import insert, or the platform''s own runtime rendering of required fields on the create / edit form. Grounded from the field''s declared required flag plus the ABSENCE of any usedInLayout edge from a Layout; under incomplete Layout coverage this absence is NOT asserted. This does NOT prove any save fails, and it does NOT see Lightning Dynamic Form (FlexiPage) placement — a field surfaced only through a Dynamic Form still matches here.'
    maxConfidence: declared
    absenceShaped: true
    dependsOnCoverage:
      - CustomField
      - Layout

  # ARC-2 concept-expansion — dataraptor-errors-ignored. ONE NODE rule on
  # OmniDataTransform `errorIgnored == true`. `errorIgnored` is an always-present
  # coerced boolean on every OmniDataTransform node (omni-data-transform.ts:421).
  # maxConfidence declared (declared config toggle, node match carries no edge, so
  # weakest() keeps the ceiling). ORG-INDEPENDENT.
  - id: rule:omnistudio/dataraptor-errors-ignored
    concept: concept:dataraptor-errors-ignored
    bind:
      componentTypes:
        - OmniDataTransform
      whereProperty:
        key: errorIgnored
        equals: true
    interpretation: '{ids} has ''Ignore Error'' turned ON — when an individual record operation inside the transform fails, the failing item is skipped and the transform CONTINUES, returning a success-shaped result even though some reads or writes did not complete. This is an error-swallowing reliability shape: a partial or silent data-integrity gap can pass undetected unless the caller explicitly inspects the returned error collection. Treat it as a review candidate for silent data loss, NOT as a transform that surfaces its failures. It is distinct from the ''Rollback on Error'' toggle — ignoring errors while not rolling back can leave partially applied data. This names the declared configuration shape from the transform''s own toggle, NOT a proven failure: it does NOT establish that any record actually fails at runtime, that data was actually lost or left partial, or whether the invoking OmniScript, Integration Procedure, or Apex caller checks the error output and compensates.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - OmniDataTransform
