  # RM-reason — firing-condition (concept:firing-condition, kind `firing-condition`,
  # ALREADY in the closed ConceptKind union: "the condition under which a
  # declarative firer runs"). ONE additive NODE rule, mirroring the shipped
  # field-provenance / owd / async-boundary class-marker NODE pattern: node
  # criteria only (componentTypes + whereProperty), no engine change beyond the
  # operator-class predicate this rule now consumes, no extractor change, no
  # refresh. The marker is ALREADY in the graph — the condition-extractor emits one
  # synthetic `ConditionalContext` node per extracted firing condition, carrying a
  # `kind` discriminant (criteria | formula | flow-decision | flow-recordtrigger)
  # parsed verbatim from the firer's XML. `whereProperty: { key: kind, in: [criteria,
  # formula, flow-recordtrigger] }` binds `properties.kind ∈ {the three entry kinds}`
  # via the additive `in` operator (see the operator-class whereProperty commit); the
  # `componentTypes: [ConditionalContext]` clause scopes the match to the synthetic
  # node type so a non-ConditionalContext node that happened to carry a `kind`
  # property can never match. A node match carries no edge, so weakest() keeps the
  # ceiling I set.
  #
  # WHY THESE THREE ENTRY KINDS (and NOT flow-decision): the four condition kinds
  # split into genuine FIRING/ENTRY gates (criteria / formula / flow-recordtrigger —
  # the condition under which the firer RUNS) and the mid-flow `flow-decision` branch
  # (which routes a flow AFTER it has already been triggered — NOT a firing gate; the
  # coupled-field-write JOIN uses the SAME split in its throughConditionKinds, which
  # already lists exactly [criteria, formula, flow-recordtrigger] and excludes
  # flow-decision as mid-flow). This rule fires on all three entry kinds and must NOT
  # fire on flow-decision — expressed in ONE clause by `kind in [criteria, formula,
  # flow-recordtrigger]`. Before the operator-class predicate the scalar node
  # predicate was equals-ONLY (one value; no OR/IN), so the rule shipped covering the
  # single `formula` kind and DEFERRED criteria / flow-recordtrigger as an honest
  # coverage gap; the `in` operator now closes that gap in a single rule while keeping
  # flow-decision out. The three-kind slice is still a clean subset of genuine firing
  # conditions with zero mid-flow contamination.
  #
  # maxConfidence `parsed`: a formula-kind condition's referenced FIELD SET is
  # resolved by the v0.2 formula tokenizer (a parse) — this is exactly the
  # confidence tier the extractor stamps on a formula condition's `firesWhen` edge
  # ("declared for XML criteria items, parsed for formula expressions resolved via
  # the formula tokenizer"). The verbatim expression string is declared, but the
  # reasoning surface (which fields the condition tests) rests on the tokenizer
  # parse, so `parsed` is the honest, conservative, model-consistent ceiling (the
  # coupled-field-write JOIN caps formula couplings at `parsed` on the same basis).
  # A criteria-kind condition's field set is `declared` (XML criteria items), so
  # capping IT at `parsed` UNDER-states its provenance — a conservative floor, never
  # an over-claim (weakest() only ever lowers confidence, never raises it).
  # absenceShaped false: this is a PRESENCE claim about a condition that IS
  # declared, never an absence conclusion.
  #
  # HONEST BOUNDARIES kept verbatim in the claim (org-independent — NO vault counts
  # in the interpretation string): the condition is read STATICALLY and NOT
  # evaluated against a live record (the product holds no record-level field
  # values), so being LISTED never proves the condition is TRUE for a given record
  # nor that the automation fires on it — that needs runtime data; the referenced
  # field set comes from a formula tokenizer, so dynamically-built / reflective
  # references may be missed; and this names the DECLARED condition, not a proven
  # runtime firing outcome. NOTE: the claim wording still says "a formula entry
  # criterion" / "formula tokenizer" — narrower than the now-covered criteria /
  # flow-recordtrigger kinds; the claim text is held verbatim per the upgrade
  # directive, and the parenthetical examples ("such as … an approval process's
  # entry criteria …") already span non-formula gates. A follow-up may generalize
  # the wording to "declared entry condition".
  #
  # Real-vault probe (read-only, no refresh; counts stay in this comment ONLY):
  # of 941 extracted ConditionalContext nodes the three entry kinds fire on 412
  # (formula 342 — validation rules 331, approval processes 11; flow-recordtrigger
  # 55; criteria 15), and the mid-flow flow-decision kind (529) is correctly NOT
  # matched — closing the criteria / flow-recordtrigger coverage gap the shipped
  # single-`formula` rule had deferred. Each match cites its single synthetic
  # ConditionalContext id at the `parsed` tier; a flow-decision condition fires
  # nothing.
  - id: rule:firing-condition/declared-not-evaluated
    concept: concept:firing-condition
    bind:
      componentTypes:
        - ConditionalContext
      whereProperty:
        key: kind
        in:
          - criteria
          - formula
          - flow-recordtrigger
    interpretation: '{ids} is a DECLARED entry condition on a declarative automation (such as a validation rule''s error-condition formula, an approval process''s entry criteria, or a record-triggered flow''s entry condition). The product reads its expression and the fields it references STATICALLY from metadata; it does NOT evaluate the condition against any live record. So whether this condition is actually true for a given record — and therefore whether its automation fires (or blocks the save) on that record — needs runtime, record-level data this offline vault does not hold. This names the condition as it is DECLARED, not a proven firing outcome; its referenced fields are resolved statically from the declared metadata, so dynamically-built or reflective references may be missed.'
    maxConfidence: parsed
    absenceShaped: false
    dependsOnCoverage:
      - ValidationRule
      - ApprovalProcess
      - WorkflowRule
  # RM-reason — flow-run-mode (concept, roadmap A11). TWO additive NODE rules,
  # both `concept:flow-run-mode` (kind `access-mechanism`, already in the closed
  # union — the same kind that houses apex-sharing-mode / OWD / view-modify-all).
  # Same class-marker NODE pattern as the apex-sharing-mode rules: node
  # `whereProperty`, string equals, `maxConfidence: declared`, `absenceShaped:
  # false`, no edge. The `runInMode` property is emitted verbatim onto every Flow
  # node by the flow extractor (packages/extractors/src/flow.ts:1952,
  # `runInMode: toNullableString(rootObj['runInMode'])`) — always key-present as
  # the exact declared enum string (`SystemModeWithoutSharing` /
  # `SystemModeWithSharing` / `DefaultMode`) or null when the flow declares none.
  # So NO extractor change, NO refresh, NO engine change; the runtime matcher
  # (`properties[key] === equals`) matches the enum token exactly.
  #
  # TIER `declared` is correct: `runInMode` is EXPLICITLY declared in the flow
  # metadata (a value the builder chose), so it is a declared-tier structural fact
  # on the SAME basis apex-sharing-mode assigns `declared` to `sharingModel` — a
  # value stated verbatim in the artifact, NOT a heuristic inference (per the
  # ConfidenceLevel taxonomy in @sf-intelligence/contracts, `parsed`/`heuristic`
  # are reserved for RESOLVED cross-references / regex recall that can be wrong; a
  # keyword present in the source has zero resolution risk). A node match carries
  # no edge, so weakest() keeps the declared ceiling.
  #
  # KEY DIFFERENCE from apex-sharing-mode, kept verbatim in the claim: an Apex
  # `without sharing` class STILL enforces object CRUD and FLS; a SYSTEM-context
  # Flow does NOT — it bypasses object CRUD and field FLS as well as (for the
  # without-sharing variant) record sharing. That extra bypass is the reasoning
  # value these rules add over the Apex analog.
  #
  # NO cross-contamination with the apex-sharing / OWD concepts, which key
  # `sharingModel`: these rules key a DIFFERENT property (`runInMode`) whose token
  # space is DISJOINT (Flow `SystemMode*` vs Apex two-word lowercase vs
  # CustomObject single-word PascalCase OWD), and `componentTypes: [Flow]` scopes
  # them to Flow only.
  #
  # DELIBERATELY only the two SYSTEM-context postures — the security-relevant ones:
  #   * `SystemModeWithoutSharing` — PRIMARY (system context, sharing NOT enforced,
  #     CRUD/FLS NOT enforced);
  #   * `SystemModeWithSharing` — informational (system context, sharing enforced,
  #     CRUD/FLS NOT enforced).
  # DEFERRED `DefaultMode` and null (no run mode declared) — the default posture is
  # CONTEXT-DEPENDENT (screen flow → running user's context; autolaunched / record-
  # triggered → differs), so a proactive claim on it would over-state a genuinely
  # ambiguous default. The nuance is folded into the concept summary as an honest
  # boundary instead. (`equals: null` also needs an isNull operator + engine change
  # the model compiler does not have.) A DefaultMode / null-runInMode flow fires
  # NEITHER rule.
  #
  # HONEST BOUNDARIES kept verbatim in each claim: this is the DECLARED posture,
  # never a proven runtime access outcome for a specific user or record (record-
  # level state the offline vault does not hold); run mode is FLOW-level — a
  # subflow runs under its OWN run mode; and any Apex the flow invokes enforces
  # sharing / FLS on its own declaration, not the flow's.
  #
  # Real-vault probe (read-only, no refresh): of 275 flow-meta files 11 declare a
  # runInMode — `SystemModeWithoutSharing` fires on 8, `SystemModeWithSharing` on 1
  # (DefaultMode 2 are DEFERRED, the remaining 264 declare no run mode and fire
  # NEITHER), each citing its single Flow node at `declared`. (Vault-specific
  # counts stay in this comment only — never baked into the org-independent
  # interpretation strings.)
  - id: rule:flow-run-mode/system-without-sharing
    concept: concept:flow-run-mode
    bind:
      componentTypes:
        - Flow
      whereProperty:
        key: runInMode
        equals: SystemModeWithoutSharing
    interpretation: '{ids} declares `runInMode` `SystemModeWithoutSharing` — it runs in SYSTEM context and does NOT enforce the running user''s record-level sharing; and it ALSO does NOT enforce object CRUD or field-level security, so it can read and write ANY object and field regardless of the running user''s permissions. (Run mode is a SEPARATE concern from CRUD/FLS: as with an Apex class running in system context, neither object CRUD nor FLS is auto-enforced — the `with`/`without sharing` keyword governs record-level sharing only.) This is OFTEN INTENTIONAL (e.g. an automation that must operate on all records) and is NOT by itself a vulnerability. Run mode is FLOW-level: a subflow this flow calls runs under its OWN run mode, and any Apex it invokes enforces sharing / FLS on its own declaration, not this flow''s. This is the DECLARED posture read from the flow''s `runInMode`, not a proven access outcome for a specific user or record.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - Flow
  - id: rule:flow-run-mode/system-with-sharing
    concept: concept:flow-run-mode
    bind:
      componentTypes:
        - Flow
      whereProperty:
        key: runInMode
        equals: SystemModeWithSharing
    interpretation: '{ids} declares `runInMode` `SystemModeWithSharing` — it runs in SYSTEM context but DOES respect the running user''s record-level sharing (organization-wide defaults, the role hierarchy, sharing rules, and manual / Apex shares). It STILL does NOT enforce object CRUD or field-level security, so it can read and write any object and field on the records the user can already see. So record VISIBILITY is enforced, but object and field permissions are not. Run mode is FLOW-level: a subflow this flow calls runs under its OWN run mode, and any Apex it invokes enforces sharing / FLS on its own declaration, not this flow''s. This is the DECLARED posture read from the flow''s `runInMode`, not a proven access outcome for a specific user or record.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - Flow
