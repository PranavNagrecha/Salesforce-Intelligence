  # EDGE rule — the dispatch relationship. `componentTypes: [ApexClass]` scopes the
  # CITATION to ApexClass endpoints, mirroring master-detail-cascade's dangling-guard
  # (an async target NOT retrieved into the vault is dropped, never fabricated as a
  # citation). weakest() drops a `future`-mechanism dispatch (heuristic) to heuristic;
  # enqueueJob / executeBatch / schedule dispatches stay declared.
  # WHY `{ids}` (a plural relationship claim), NOT a positional `{0} dispatches {1}`:
  # a SCALAR edge rule's citation is VARIABLE-LENGTH — the same shipped convention the
  # status-code and master-detail-cascade rules follow (both use `{ids}`). A positional
  # `{0}`/`{1}` template is UNSAFE here, proven against the real vault: of 30
  # `dispatchesAsync` edges, 2 have a NON-ApexClass source (an ApexTrigger and an LWC
  # bundle) — anchoring on one cites only the ApexClass TARGET (length 1), so `{1}`
  # renders as a LITERAL token and `{0}` names the target as if it were the dispatcher;
  # and an ApexClass caller with MULTIPLE async targets cites [caller, t1, t2, …]
  # (length 3+), which `{0} dispatches {1}` silently truncates to the first target. The
  # `{ids}` claim states the DEFERRED-EFFECT consequence (the concept's whole point)
  # honestly for a citation of any length — 1 (a target-only or non-Apex anchor), 2 (a
  # caller→target pair), or N (a caller fanning out to several async classes) — and
  # `groundedIn` always carries every cited id for synthesize_answer.
  - id: rule:async-boundary/dispatches-async
    concept: concept:async-boundary
    bind:
      edgeType: dispatchesAsync
      componentTypes:
        - ApexClass
    interpretation: 'Async dispatch relationship among {ids}: an async class (Queueable / Batch / Scheduled / @future) is enqueued at a dispatch site. The cited ids are the ApexClass endpoints of that dispatch and include BOTH the dispatcher and its async TARGET(s); a non-ApexClass dispatcher (e.g. a trigger or LWC) is not an ApexClass endpoint, so it is dropped and a lone cited id is the async target reached from such a source. It is the async TARGET whose work runs in a SEPARATE transaction from the one that enqueued it — its writes are not visible to the enqueuing (current) transaction, and its effect is DEFERRED (downstream automation in that same transaction does not see it). Do NOT assume every cited id is async: confirm which cited component is the dispatcher versus the async job, and confirm timing before relying on the result. The CLASS-GRANULAR @future variant of this edge fires when the target class has SOME @future method, not necessarily the invoked one, so it may OVER-attribute a @future hop to a synchronous call. This does not assert WHEN the async work runs or whether it succeeds.'
    # REASONING-ASYNC-TEST-CALLER-BLEED — test-caller plane guard. A `dispatchesAsync`
    # edge's DISPATCH SITE is its `from` (the caller). When a production async class's
    # ONLY observed dispatchers are TEST classes, the bare relationship claim above
    # reads as a production async path though no production code reaches the job. The
    # witness partition classifies each matched edge by the DISPATCHER's `isTest` (the
    # unconditionally-present ApexClass boolean): a test dispatcher is a TEST WITNESS,
    # anything else (non-test / a non-ApexClass trigger source / a dangling unretrieved
    # caller) is a PRODUCTION dispatch. Production-only ⇒ the base claim, byte-identical
    # to the pre-guard path. MIXED ⇒ the base claim over PRODUCTION dispatchers only,
    # the test dispatchers excluded from reachability and merely disclosed. TEST-ONLY ⇒
    # the witness-only claim, which refuses to assert a production dispatch path. The
    # async TYPE of the target is unaffected — only the reachability plane is corrected.
    witnessPartition:
      roleEndpoint: from
      witnessProperty: isTest
      interpretationWitnessOnly: 'Test-only async dispatch among {ids}: the ONLY observed dispatch sites for this async class are TEST classes, so this is NOT evidence of a production async execution path — no production dispatcher was found in the vault. A test class enqueues the async job only while its test runs; that does not establish that production code reaches it. The cited ids are the ApexClass endpoints (the async target and its test-class dispatchers), disclosed as test witnesses rather than hidden. The target is still structurally async (its work would run in a SEPARATE, DEFERRED transaction IF a production caller enqueued it), but no such caller is grounded here. Absence of a production dispatcher may also reflect INCOMPLETE coverage — an unretrieved or dynamically-invoked caller would not appear; confirm before concluding the async job is unreachable in production.'
      interpretationMixedWitnessSuffix: 'Excluded from the production dispatch path above and disclosed as test witnesses only: {witnessIds} — these are TEST-class dispatch sites; a test class enqueues the job only while its test runs, so it does NOT establish production reachability and is kept out of the production claim.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - ApexClass
  # C13 / EC-4 — queueable→queueable dispatchesAsync chain (dual endpoint isQueueable).
  - id: rule:async-boundary/queueable-chain-depth
    concept: concept:queueable-chain-depth
    bind:
      edgeType: dispatchesAsync
      componentTypes:
        - ApexClass
      fromWhereProperty:
        key: isQueueable
        equals: true
      toWhereProperty:
