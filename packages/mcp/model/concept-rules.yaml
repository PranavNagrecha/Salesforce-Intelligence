  # RM-reason — view-modify-all object-grant (concept #13, kind `access-mechanism`,
  # already in the closed union). TWO additive EDGE rules over the `grantedBy` edge,
  # mirroring the shipped `master-detail-cascade` EDGE shape EXACTLY (edgeType +
  # componentTypes citation-scope + edgeWhereProperty). No engine change, no
  # extractor change, no refresh: the permission-set AND profile extractors already
  # emit one `grantedBy` edge per `<objectPermissions>` entry (PermissionSet/Profile
  # --grantedBy--> CustomObject) carrying the always-present boolean edge properties
  # `viewAllRecords` / `modifyAllRecords` (parsed verbatim from the object-permission
  # entry; `declared` confidence). `componentTypes: [PermissionSet, Profile,
  # CustomObject]` scopes the CITATION exactly like master-detail-cascade's
  # dangling-guard: a grant whose object endpoint was NOT retrieved into the vault
  # (a standard object referenced by objectPermissions but not modeled) is DROPPED
  # from the citation, never fabricated, while the edge still fires. `edgeWhereProperty`
  # matches the boolean on the EDGE's OWN properties.
  #
  # BOTH anchor directions fire via edge-branch root-scoping (interpret.ts fetches
  # `direction: both` for `grantedBy`): an OBJECT anchor cites its INCOMING grants
  # (the object + each granting permission set/profile — an ENUMERATED SET), a
  # PERMSET/PROFILE anchor cites its OUTGOING grants (the grantor + each object it
  # grants View/Modify All on). `{ids}` (a variable-length relationship citation,
  # NOT positional `{0}`/`{1}`) is REQUIRED: the citation length varies (one object
  # with N grantors, or one grantor with N objects, or a length-1 dangling endpoint),
  # and the same anchor-agnostic relationship claim must read correctly for either
  # endpoint order — the wording names the RELATIONSHIP and its two endpoint ROLES
  # (grantor + object) rather than assuming which cited id is which. This mirrors the
  # shipped status-code / master-detail-cascade / dispatches-async `{ids}` convention.
  #
  # Modify⊆View OVERLAP (the double-count caution): every `modifyAllRecords: true`
  # edge is ALSO a `viewAllRecords: true` edge (Modify All implies View All — probed
  # on the real vault: 0 modify-all grants without view-all), so BOTH rules fire on a
  # Modify-All grant. They are worded as ONE ESCALATING grant — the modify-all claim
  # states it is the STRONGER form that INCLUDES View All and that the view-all claim
  # also fires on the same grant — so co-firing reads as escalation, never as two
  # contradictory/duplicative independent grants. (A clean Modify⊄View EXCLUSION —
  # firing view-all ONLY on view-all-but-not-modify-all edges — would need an
  # `edgeWhereProperty` AND-array [viewAllRecords=true, modifyAllRecords=false],
  # a future engine generalization mirroring the node `whereProperty` AND-array the
  # system-context rules use; deliberately NOT built now. Today the two rules
  # co-fire on a modify-all grant, disclosed as escalation.)
  #
  # HONEST BOUNDARIES kept verbatim in each claim (org-independent — NO vault counts
  # in the interpretation strings): OBJECT-LEVEL only — does NOT bypass FIELD-LEVEL
  # SECURITY; is NOT the org-wide `ViewAllData`/`ModifyAllData` SYSTEM permission
  # (broader, separate — spans every object, this is one object); says nothing about
  # OTHER objects; does NOT assert WHO HOLDS the permission set/profile (an
  # assignment / live-plane question); it is the DECLARED grant, not a proven
  # per-user access outcome. A dedicated why-cant-user-see-record tool already
  # computes this per user — the value here is surfacing it deterministically with
  # citations through interpret() and closing the OWD concept's acknowledged gap.
  #
  # maxConfidence declared: a `grantedBy` object-permission edge is `declared`, and
  # weakest() keeps the ceiling unless a weaker edge appears. absenceShaped false:
  # each is a PRESENCE claim about a grant that IS declared, never an absence
  # conclusion. Real-vault probe (read-only, no refresh), counting FULLY-GROUNDED
  # grants (both endpoints resolve to a modeled node, i.e. what these rules cite):
  # view-all fires on 1125 grants over 87 objects from 58 grantors (PermissionSet +
  # Profile); modify-all on 386 grants over 87 objects from 18 grantors, a STRICT
  # SUBSET of the view-all grants. An object with no such grant fires neither.
