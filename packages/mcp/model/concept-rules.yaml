    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - PermissionSet
      - Profile
      - CustomObject
  - id: rule:access/modify-all-records
    concept: concept:view-modify-all
    bind:
      edgeType: grantedBy
      componentTypes:
        - PermissionSet
        - Profile
        - CustomObject
      edgeWhereProperty:
        key: modifyAllRecords
        equals: true
    interpretation: 'Object-level Modify All Records grant among {ids}: a permission set or profile grants "Modify All Records" on an object — the STRONGER form of the same object-level grant, which INCLUDES View All Records (Modify All implies View All), so the View All Records interpretation ALSO fires on this same grant; the two describe ONE escalating grant, not two independent ones. Any user who HOLDS that permission set/profile can READ, EDIT, and DELETE every record of that object regardless of the org-wide default, sharing rules, the role hierarchy, or manual shares — this OVERRIDES the object''s record-level sharing even when its org-wide default reads Private. The cited ids are the two endpoints of this grant relationship: the granting permission set(s)/profile(s) and the object they apply to (when many ids are cited on one object, they are the ENUMERATED SET of permission sets/profiles that each grant Modify All on it, not a per-grant alarm). BOUNDARIES: this is OBJECT-LEVEL only and does NOT bypass FIELD-LEVEL SECURITY; it is NOT the org-wide "Modify All Data" SYSTEM permission, which is broader and separate — this applies only to THIS object and says nothing about any other; and it is the DECLARED grant read from metadata, NOT a proof that any specific user actually holds that permission set/profile (an assignment question the offline vault cannot answer) or a proven per-user access outcome for a record. For a specific user, use the why-cant-user-see-record tool.'
    # SYSTEM-PERM PARTITION (REASONING-VIEW-MODIFY-ALL-MIXES-SYSTEM-PERMS): mirrors
    # the view-all rule, but witnesses ONLY on `ModifyAllData` — the org-wide
