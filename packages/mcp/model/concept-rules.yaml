      interpretationMixedWitnessSuffix: 'Separately, {witnessIds} also grant "Modify All Records" on this object but ALSO hold the org-wide "Modify All Data" system permission, so their modify-all here cannot be told apart from that broader grant (which spans every object) — they are EXCLUDED from the object-level list above; verify them on the grantor.'
