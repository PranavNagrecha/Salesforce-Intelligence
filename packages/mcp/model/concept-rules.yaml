# Concept model — reasoning seed rules (RM-2 DATA track).
#
# CURATOR-OWNED source of truth. Each rule binds a Concept (by id) to a
# STRUCTURAL predicate over a grounded slice — types, categories, edge kinds,
# and property values ONLY. NO canonical component ids ever appear here: org
# specificity enters the reasoning engine solely through the caller-supplied
# grounded slice at query time.
#
# Compiled to TypeScript by packages/mcp/scripts/build-concept-model.mjs
#   ->  packages/mcp/src/knowledge/generated/concept-model.ts  (DO NOT hand-edit).
# Regenerate:  pnpm regen:concept-model      Parity gate:  pnpm check:concept-model
#
# conceptRules is an ORDERED sequence; each rule carries:
#   id                 - rule id (kebab/slash, `rule:` prefixed; never a canonical id)
#   concept            - the ConceptId this rule interprets (must exist in concepts.yaml)
#   bind               - a structural RulePredicate (>=1 of edgeType / componentTypes /
#                        conditionKind / whereProperty / order); NO component ids
#   interpretation     - template with `{ids}` / positional `{0}` tokens
#   maxConfidence      - ceiling (declared | parsed | heuristic); emitted confidence
#                        is the WEAKEST of it and every matched edge, never higher
#   absenceShaped      - true when the claim is about ABSENCE (only as strong as coverage)
#   dependsOnCoverage  - bare ComponentType families the rule's honesty hinges on
#
# List ORDER is significant and preserved verbatim into the generated artifact.

conceptRules:
  - id: rule:status-code/cross-ref-automation
    concept: concept:status-code
    bind:
      edgeType: triggersOn
      componentTypes:
        - ApexTrigger
        - Flow
        - ApexClass
    interpretation: Any of {ids} could have aborted the save; verify which ran.
    # REASONING-STATUS-CODE-CITES-INACTIVE-AUTOMATION — dead-plane liveness guard.
    # The bare "could have aborted" claim cited every `triggersOn` firer with NO
    # active filter, so it named Draft/Obsolete Flows and Inactive triggers as
    # save-abort suspects though they DO NOT RUN. This witness partition
    # (`witnessKind: inactive-firer`) classifies each matched firer edge by the
    # FIRER (`from`) endpoint's liveness under the shared SOE `isActiveSoeFirer`
    # predicate — a Draft/Obsolete Flow or Inactive ApexTrigger is a WITNESS
    # (excluded), while a status-less/always-live firer (an ApexClass has no
    # status) is KEPT. So: ACTIVE-ONLY ⇒ the base claim over active firers, exactly
    # the pre-guard output on a clean object; MIXED ⇒ the base claim over ACTIVE
    # firers only, the inactive ones excluded and disclosed; ALL-INACTIVE ⇒ the
    # explicit no-active-automation disclosure (never a production abort claim).
    witnessPartition:
      roleEndpoint: from
      witnessKind: inactive-firer
      interpretationWitnessOnly: 'None of the automation configured to fire on this object is currently ACTIVE — {ids} are all INACTIVE (a Draft/Obsolete Flow or an Inactive trigger), so none of them could have aborted the save. This is a no-active-automation disclosure, NOT a save-abort suspect claim: the cited components still exist in the org and could abort the save if reactivated. Absence of an active firer may also reflect incomplete extraction — confirm before concluding nothing runs on save.'
      interpretationMixedWitnessSuffix: 'Excluded as INACTIVE and NOT treated as save-abort suspects: {witnessIds} — these are Draft/Obsolete Flows or Inactive triggers/rules that do not run, so they could not have aborted the save (they remain in the org and could if reactivated).'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - ApexTrigger
      - Flow
  # RE-GROUNDED (was `sourceOfTruth == derived`). The v2.9 vocabulary
  # classifier that populates `sourceOfTruth` has NOT run on the real vault, so
  # 0 fields carry it and the old binding fired on nothing. This binds instead
  # on `isFormula`, the always-present grounded signal the CustomField extractor
  # emits (custom-field.ts: `isFormula: true` whenever a non-empty `<formula>`
  # body is present). A formula field IS derived and read-only, so this is the
  # honest grounded signal for the concept today. Roll-up summary fields (also
  # derived/read-only) are NOT formula fields and are covered by the separate
  # `rule:relationship/master-detail-rollup` rule, so the two do not overlap.
  - id: rule:field-provenance/derived-read-only
    concept: concept:field-provenance
    bind:
      componentTypes:
        - CustomField
      whereProperty:
        key: isFormula
        equals: true
    interpretation: '{ids} is a FORMULA (derived) field → read-only; a write from a flow or integration will fail with a field-integrity error, so never map it as a write target.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - CustomField
  # DEFERRED — rule:save-order/phase-order (concept:save-order) removed here.
  # It bound `order: 4` (the after-triggers phase index) on Flow / ApexTrigger /
  # WorkflowRule nodes, but 0 automation nodes carry an `order` property today:
  # the save-order phase index is not extracted onto Flow / ApexTrigger /
  # WorkflowRule nodes, so the rule fired on nothing on a real vault and would
  # ship as dead weight. Re-introduce it only once a grounded save-order phase
  # index is extracted onto those nodes. Nothing is lost by deferring: the
  # `order_of_execution` / `what_happens_on_save` tools already cover the
  # save-order need directly. `concept:save-order` stays in concepts.yaml as
  # curated knowledge (it grounds no rule until then).
  - id: rule:relationship/master-detail-cascade
    concept: concept:relationship
    bind:
      edgeType: lookupTo
      # Dangling-parent citation guard: a master-detail `lookupTo` may point at a
      # managed/standard master object NOT retrieved into the vault (a legal
      # dangling edge — custom-field.ts). With `componentTypes` set, `runBind`
      # cites ONLY endpoints whose node RESOLVES in the slice to one of these
      # types, so an ungrounded parent is dropped (never fabricated as a
      # citation) while the edge still fires when the child field qualifies.
      componentTypes:
        - CustomField
        - CustomObject
      edgeWhereProperty:
        key: relationshipType
        equals: MasterDetail
    interpretation: 'Master-detail relationship ({ids}): deleting the parent record cascade-deletes every child record, the child inherits the parent''s ownership and sharing (it has none of its own), and the child cannot exist without a parent. How many child records exist is a live-plane question.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - CustomField
      - CustomObject
  # Junction / many-to-many detection — an object carrying EXACTLY TWO distinct
  # master-detail parents. A master-detail `lookupTo` edge hangs off the child's
  # FIELD, so the object node has ZERO incident ones: counting distinct parents
  # is a 2-hop over the object's OWN fields (object -> its fields -> their
  # parents), an EXACT-cardinality aggregate the shipped incident/gte count could
  # not express. The four additive RuleAggregate knobs do it:
  #   * edgeSource: root-children-outgoing — count lookupTo edges whose FROM node
  #     is a CustomField with parentId === the queried object;
  #   * countedEdgeWhereProperty relationshipType=MasterDetail — a plain lookup
  #     never counts toward a junction;
  #   * countDistinctEndpoint: to — DISTINCT parent objects, so two master-detail
  #     fields at the SAME parent count as one (never two);
  #   * op: eq, threshold 2 — exactly two masters (three is not a junction).
  # No groupByEdgeProperty ⇒ one undifferentiated group. Citation order is
  # [rootObject, sorted parents] so {0} is the junction and {1}/{2} the masters —
  # all three resolve on a grounded junction (an unresolved parent endpoint is
  # dropped, so it never over-cites). maxConfidence declared: every master-detail
  # lookupTo edge is declared, and weakest() keeps the ceiling. The claim wording
  # stays honest — it does NOT name a primary parent (relationshipOrder not
  # extracted), assert reparentability (reparentableMasterDetail not extracted),
  # or count junction records (a live-plane, record-level question). Real-vault
  # probe: fires on exactly 2 objects, both fully grounded, both ControlledByParent.
  - id: rule:relationship/junction-object
    concept: concept:junction-object
    bind:
      edgeType: lookupTo
      # Cites ONLY endpoints whose node RESOLVES in the slice to one of these
      # types: the child's master-detail FIELD (the counted edge's FROM) and each
      # master parent object (the TO — the citation). An ungrounded parent is
      # dropped, never fabricated.
      componentTypes:
        - CustomField
        - CustomObject
      aggregate:
        edgeSource: root-children-outgoing
        countedEdgeWhereProperty:
          key: relationshipType
          equals: MasterDetail
        countDistinctEndpoint: to
        op: eq
        threshold: 2
    # TEMPLATE↔KNOB coupling (keep in lockstep): the "exactly two ({1} and {2})"
    # wording below is valid ONLY because `op: eq, threshold: 2` — it renders
    # precisely two counted endpoints. A future flip to `op: gte` would let a
    # corrupt/3-parent count fire while the template still names only two (A and
    # B), silently dropping the third. Change the wording and the op together.
    interpretation: '{0} has exactly two master-detail parents ({1} and {2}) — the structural signature of a many-to-many junction. This is the structural pattern only; the object may still carry its own fields, automation, and business data. Because both relationships are master-detail, deleting a record of EITHER parent cascade-deletes the junction records, and the object is necessarily Controlled by Parent (a master-detail invariant, inferred from the relationship type, not read from this object''s sharing model); record access is gated by both masters. This names the structural pattern, not a proven pure-connector design intent, and Controlled by Parent is derived from the two master-detail edges rather than read from the object''s sharingModel; which parent is primary and whether the junction is reparentable are not determinable offline, and how many junction records exist under a given parent is a live-plane question.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - CustomField
      - CustomObject
  - id: rule:relationship/master-detail-rollup
    concept: concept:relationship
    bind:
      componentTypes:
        - CustomField
      whereProperty:
        key: dataType
        equals: Summary
    interpretation: '{ids} is a roll-up summary field: it aggregates child records across a master-detail relationship and recalculates automatically when a child record is inserted, updated, deleted, or undeleted. It is read-only and cannot be written by a flow or integration.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - CustomField
  # C9 / EC-13 — Summary field WITH grounded summaryForeignKey + summaryOperation.
  # Uses `{prop:…}` claim-template node-property interpolation (EC-13) so the claim
  # names the SPECIFIC child relationship and aggregate op, not a generic Summary.
  - id: rule:relationship/rollup-recalc-source
    concept: concept:rollup-recalc-source-coupling
    bind:
      componentTypes:
        - CustomField
      whereProperty:
        - key: dataType
          equals: Summary
        - key: summaryForeignKey
          isNull: false
        - key: summaryOperation
          isNull: false
    interpretation: '{0} is a roll-up summary that recalculates from child relationship field {prop:summaryForeignKey} using operation {prop:summaryOperation}. Child inserts/updates/deletes on that relationship recompute this field; it is read-only to flows and integrations.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - CustomField
  # RM-loop — the FIRST multi-edge JOIN rule. A firer F (WorkflowRule /
  # ValidationRule / ApprovalProcess / AutoResponseRule / AssignmentRule /
  # EscalationRule / Flow) firesWhen -> a ConditionalContext whose `fieldRefs`
  # array lists the gated fields; the JOIN intersects those fields with the ones
  # a DIFFERENT automation W (Flow / ApexTrigger / ApexClass / WorkflowRule /
  # ApprovalProcess) writesTo, scoped SAME-OBJECT (object of F == object of the
  # gated field) and self-excluded (W != F). Real-vault probe: 379 same-object
  # couplings (327 ValidationRule, 49 ApprovalProcess, 3 AssignmentRule). A Flow
  # firer's object is derived from its `triggersOn` edge (its id has no object
  # segment), so record-triggered Flow firers ARE eligible — but contribute 0 on
  # this vault: its 55 flow-recordtrigger entry conditions are formula-mode
  # (`<filterFormula>`) whose `fieldRefs` are NOT extracted, so no shared key X
  # exists to join (the 529 Flow CCs that DO carry fieldRefs are flow-decision,
  # correctly excluded as mid-flow). The Flow path is latent, unlocked when
  # record-trigger entry-condition field refs are extracted.
  # RM-loop PASS 2 — the engine now DERIVES each side's save-order phase
  # (packages/mcp/src/knowledge/save-order-phase.ts, mapping LIFTED from
  # order-of-execution.ts so the two never drift) and UPGRADES the claim from
  # coupling to a strict cross-phase computed gate when — and ONLY when — phase(W)
  # and phase(F) are both confidently placed, the FIRER runs within the
  # SYNCHRONOUS save (NOT post-save-approval), AND phase(W) is strictly earlier
  # than phase(F). That is the `interpretationCrossPhase` template below; any
  # doubt (phase unplaceable on either side — e.g. an ApexClass writer, a
  # timing-less Flow, an ambiguous before+after ApexTrigger — a non-synchronous
  # firer, or equal/reverse order) keeps the honest phase-AGNOSTIC
  # `interpretation` coupling claim (F's condition tests a field W also writes;
  # confirm the save order). The upgrade NEVER asserts an ordering it cannot
  # ground.
  # HONESTY — the upgrade proves phase ORDER, not same-save CO-FIRING for every
  # case:
  #   * ApprovalProcess firers are EXCLUDED. Approval submission is not a
  #     synchronous save-order step (order-of-execution.ts: "Approval submission
  #     isn't a standard SOE step") — the post-save Flow wrote the field on a
  #     SAVE, but the approval's entry criteria evaluate on a separate SUBMIT
  #     action, so they never co-fire. isSynchronousSavePhase(firerPhase) drops
  #     these (33 of 47 real upgrades were approval over-claims).
  #   * A create-only / event-scoped writer does not run on every save its firer
  #     does, so `interpretationCrossPhase` states the proven phase-ORDER fact and
  #     CONDITIONS the causation on the writer running ("On saves where {2}
  #     runs…") rather than asserting an absolute "{0} IS reacting … not your
  #     direct edit" that would be false on a save where {2} did not fire.
  # Condition kinds are limited to genuine firing / entry gates (criteria,
  # formula, flow-recordtrigger); a mid-flow flow-decision branch is excluded.
  # maxConfidence parsed: firesWhen/writesTo are parsed or declared, and an Apex
  # writesTo (heuristic) drags THAT coupling to heuristic via weakest(); phase
  # derivation adds no edge, so it does not change confidence.
  # D5 — aggregate count of CustomField children with trackHistory=true ≥ 20.
  # Uses root-outgoing parentOf edges (CustomObject → CustomField) + endpoint
  # whereProperty on the field node. Declared confidence: trackHistory is a
  # declared field metadata bit.
  - id: rule:field/history-tracking-cap
    concept: concept:field-history-tracking-20-field-limit
    bind:
      edgeType: parentOf
      componentTypes:
        - CustomField
      aggregate:
        edgeSource: root-outgoing
        endpointWhereProperty:
          key: trackHistory
          equals: true
        countDistinctEndpoint: to
        op: gte
        threshold: 20
    interpretation: '{object} has {count} fields with field history tracking enabled — at Salesforce''s 20-field-per-object cap (or beyond). Enabling tracking on another field requires turning it off on an existing tracked field first.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - CustomField

  # C8 / EC-4 — formula field whose references edge targets an isFormula or Summary field.
  - id: rule:field/formula-on-derived-formula
    concept: concept:formula-on-derived
    bind:
      edgeType: references
      componentTypes:
        - CustomField
      fromWhereProperty:
        key: isFormula
        equals: true
      toWhereProperty:
        key: isFormula
        equals: true
    interpretation: '{0} is a formula field that references another formula field {1} — a second-order derivation. A change to the deeper formula''s inputs can ripple through both recalculations; confirm dependency depth with find_formula_references before editing either field.'
    maxConfidence: parsed
    absenceShaped: false
    dependsOnCoverage:
      - CustomField
  - id: rule:field/formula-on-derived-summary
    concept: concept:formula-on-derived
    bind:
      edgeType: references
      componentTypes:
        - CustomField
      fromWhereProperty:
        key: isFormula
        equals: true
      toWhereProperty:
        key: dataType
        equals: Summary
    interpretation: '{0} is a formula field that references roll-up summary field {1} — a second-order derivation over an aggregate. Child DML that recalculates {1} can also change {0}; confirm with find_formula_references and order_of_execution.'
    maxConfidence: parsed
    absenceShaped: false
    dependsOnCoverage:
      - CustomField

  # D2 / EC-4 — ValidationRule references a Summary field (pre-rollup-recalc gate).
  # HONEST GAP: Flow/WorkflowRule firers whose firesWhen ConditionalContext lists
  # a Summary field in fieldRefs are NOT expressible — JOIN cannot filter through-key
  # node properties; only the direct ValidationRule `references` edge path ships.
  - id: rule:automation/validation-gates-rollup-stale
    concept: concept:validation-gates-on-rollup-recalculated-later
    bind:
      edgeType: references
      componentTypes:
        - ValidationRule
        - CustomField
      toWhereProperty:
        key: dataType
        equals: Summary
    interpretation: '{0} references roll-up summary field {1} in its error condition — validation runs in pre-save-validation BEFORE post-save-rollup-recalc, so the rule tests the PRE-SAVE aggregate, not the value after child DML on this save is rolled up. If the rule should react to the updated roll-up, gate on a different field, move validation later, or redesign around the phase order.'
    maxConfidence: parsed
    absenceShaped: false
    dependsOnCoverage:
      - ValidationRule

  # C12 / EC-7 — Apex writesTo a curated setup-object name (MIXED_DML risk surface).
  - id: rule:apex/mixed-dml-setup-write
    concept: concept:mixed-dml-setup-vs-nonsetup
    bind:
      edgeType: writesTo
      componentTypes:
        - ApexClass
        - ApexTrigger
        - CustomField
        - CustomObject
      toObjectIn:
        - User
        - Group
        - PermissionSet
        - PermissionSetAssignment
        - UserRole
        - Profile
        - QueueSobject
        - ObjectPermissions
        - FieldPermissions
        - SetupEntityAccess
    interpretation: '{0} writes setup object data at {1} — DML on setup objects (User, Group, PermissionSet, roles, profiles, …) cannot mix with non-setup DML in the same synchronous transaction (MIXED_DML_OPERATION). Confirm call paths do not also write business objects in the same txn, or move setup DML into a separate async/context boundary.'
    maxConfidence: heuristic
    absenceShaped: false
    dependsOnCoverage:
      - ApexClass
      - ApexTrigger

  - id: rule:automation/coupled-field-write
    concept: concept:cross-phase-computed-gate
    bind:
      edgeType: firesWhen
      componentTypes:
        - WorkflowRule
        - ValidationRule
        - ApprovalProcess
        - AutoResponseRule
        - AssignmentRule
        - EscalationRule
        - Flow
      join:
        throughType: ConditionalContext
        throughConditionKinds:
          - criteria
          - formula
          - flow-recordtrigger
        throughKeyArray: fieldRefs
        writeEdgeType: writesTo
        writerTypes:
          - Flow
          - ApexTrigger
          - ApexClass
          - WorkflowRule
          - ApprovalProcess
        sameObject: true
        excludeSelf: true
        # REASONING-COUPLED-FIELD-WRITE-DEAD-PLANE — dead-plane gates. Before this,
        # the JOIN cited INACTIVE firers (a Draft/Obsolete Flow, an inactive
        # ValidationRule) and TEST-only Apex writers (isTest) as if they were a
        # LIVE production coupling. `excludeInactiveFirer` drops a coupling whose
        # FIRER is provably inactive under the shared SOE `isActiveSoeFirer`
        # predicate (an inactive gate does not run, so it owns no live coupling);
        # `excludeTestWriter` drops a WRITER that is a test class (`isTest`), which
        # writes the field only while a test runs and never establishes a
        # production write path. `excludeInactiveWriter` is the writer-side twin of
        # `excludeInactiveFirer`: it drops a WRITER that is provably inactive under
        # the same SOE predicate (a Draft/Obsolete/Inactive Flow, an Inactive
        # ApexTrigger) — an Obsolete Flow writer carries no `isTest`, so only this
        # gate keeps it out of the live "also writes" set. A production (active
        # firer, active non-test writer) coupling is UNCHANGED.
        excludeInactiveFirer: true
        excludeTestWriter: true
        excludeInactiveWriter: true
    interpretation: 'Automation {0}''s firing condition tests {1}, which automation {2} also writes — so {0} may be reacting to a value another automation computed, not your direct edit. Confirm the save order with order_of_execution.'
    interpretationCrossPhase: 'Automation {0}''s firing condition tests {1}, which automation {2} writes in an EARLIER save-order phase ({writerPhase} before {firerPhase}). On saves where {2} runs, {0} tests {2}''s computed value rather than your direct edit — so changing a different field can trigger {0}. Confirm with order_of_execution.'
    maxConfidence: parsed
    absenceShaped: false
    dependsOnCoverage:
      - Flow
      - ApexTrigger
      - WorkflowRule
  # EC-6 / C11 — single-node dual-edge sameObject. An automation that both
  # triggersOn object X and writesTo a field (or the object) on X can re-enter
  # the save order. Presence-shaped; inactive firers excluded. Heuristic: the
  # structural pair proves POSSIBLE re-entry, not that every save loops.
  # C10 / EC-5 — same JOIN as coupled-field-write, but phaseFilter: writer-later
  # so it ONLY emits when W's save-order phase is strictly AFTER F's. The gate
  # therefore cannot observe W's write on the same save (invisibility).
  - id: rule:automation/cross-phase-write-invisibility
    concept: concept:cross-phase-write-invisibility
    bind:
      edgeType: firesWhen
      componentTypes:
        - WorkflowRule
        - ValidationRule
        - ApprovalProcess
        - AutoResponseRule
        - AssignmentRule
        - EscalationRule
        - Flow
      join:
        throughType: ConditionalContext
        throughConditionKinds:
          - criteria
          - formula
          - flow-recordtrigger
        throughKeyArray: fieldRefs
        writeEdgeType: writesTo
        writerTypes:
          - Flow
          - ApexTrigger
          - ApexClass
          - WorkflowRule
          - ApprovalProcess
        sameObject: true
        excludeSelf: true
        excludeInactiveFirer: true
        excludeTestWriter: true
        excludeInactiveWriter: true
        phaseFilter: writer-later
    interpretation: 'Automation {0}''s firing condition tests {1}, which automation {2} writes in a LATER save-order phase ({writerPhase} after {firerPhase}). On this save {0} can NEVER observe {2}''s write — it evaluates the pre-write value. If you expected {2}''s update to satisfy {0}, move the write earlier, relax the gate, or confirm with order_of_execution.'
    maxConfidence: parsed
    absenceShaped: false
    dependsOnCoverage:
      - Flow
      - ApexTrigger
      - WorkflowRule

  - id: rule:automation/recursive-self-write
    concept: concept:recursive-automation-self-write
    bind:
      componentTypes:
        - Flow
        - ApexTrigger
        - WorkflowRule
        - ApprovalProcess
      dualEdge:
        edgeTypeA: triggersOn
        edgeTypeB: writesTo
        sameObject: true
        excludeInactive: true
    interpretation: 'Automation {0} both fires on {1} and writes {2} on the SAME object — a self-write. IF that write runs in an AFTER-save context (or issues a separate UPDATE DML), it can RE-ENTER the save order and recurse; a BEFORE-save in-place field assignment on the triggering record does NOT re-enter (it mutates the record before the single save and issues no new DML). Confirm the write''s timing and any recursion guards with order_of_execution before concluding it recurses.'
    maxConfidence: heuristic
    absenceShaped: false
    dependsOnCoverage:
      - Flow
      - ApexTrigger
      - WorkflowRule
  # D9 / property-equals-endpoint — flow-self-dml-reentry. A record-triggered Flow
  # whose DECLARED triggerObject equals the object scope of a writesTo DML
  # endpoint can re-enter the save order. Unlike C11 (dualEdge sameObject:true,
  # ANY writesTo including a before-save in-place $Record field assignment), this
  # grounds the trigger object on the node property AND gates the write to a real
  # DML statement (operation in recordCreate/recordUpdate/recordDelete) — so the
  # non-reentrant beforeSaveFieldAssignment case is EXCLUDED. Active flows only.
  - id: rule:automation/flow-self-dml-reentry
    concept: concept:flow-self-dml-reentry
    bind:
      componentTypes:
        - Flow
      propertyEqualsEndpoint:
        nodeProperty: triggerObject
        endpointEdgeType: writesTo
        relation: equal
        endpointEdgeWhereProperty:
          key: operation
          in:
            - recordCreate
            - recordUpdate
            - recordDelete
        excludeInactive: true
    interpretation: 'Flow {0} is record-triggered on {prop:triggerObject} and performs a DML {writeOp} on that SAME object (endpoint {1}) — a self-DML write that can RE-ENTER the save order: the DML starts a fresh save that re-invokes record-triggered automation on {prop:triggerObject}, including this flow. Unlike a before-save in-place $Record field assignment (which does NOT re-enter), this is an actual DML statement. Confirm with order_of_execution and the flow''s entry / update-field conditions whether the re-entry is intentional or guarded.'
    maxConfidence: heuristic
    absenceShaped: false
    dependsOnCoverage:
      - Flow
  # RM-loop — the FIRST AGGREGATE group-count rule. For a root CustomObject, count
  # its INCOMING `triggersOn` edges from ACTIVE record-triggered Flows, bucketed by
  # the flow's exact TRIGGER CONTEXT (before-save / after-save / before-delete,
  # from the edge's `triggerType`: RecordBeforeSave -> before-save,
  # RecordAfterSave -> after-save, RecordBeforeDelete -> before-delete; an
  # absent/unknown value is NOT counted). Fire once per context carrying >= 2
  # ACTIVE flows — the Salesforce one-record-triggered-flow-per-object-per-context
  # best practice; two flows in one context run in an undefined order.
  # THREE DISJOINT CONTEXTS (RM-loop cry-wolf FIX): before-save, after-save, and
  # before-delete are separate execution contexts. A before-delete flow runs only
  # on the DELETE path, so it can NEVER co-execute with a save-timing flow —
  # bucketing it separately stops the earlier HIGH cry-wolf bug where a
  # RecordAfterSave flow + a RecordBeforeDelete flow falsely read as "two flows in
  # the same save phase". Two before-delete flows on one object DO stack (undefined
  # delete-path order) and legitimately fire a before-delete collision.
  # ACTIVE-ONLY is LOAD-BEARING (endpointWhereProperty status=Active, matched
  # against the ENDPOINT Flow NODE, not the edge): a vault carries every EXTRACTED
  # flow version, so an object may show many `triggersOn` edges most of which are
  # obsolete/draft dead versions. Real-vault probe (WITH the 3-way context fix):
  # 19 objects fire >= 2 in a single context — 7 before-save buckets + 15
  # after-save buckets (3 objects stack in BOTH), 0 before-delete collisions. The
  # count is UNCHANGED from the old 2-bucket fold on this vault because the vault
  # holds ZERO active before-delete flows — so the cry-wolf bug (a before-delete
  # flow folded into the after-save bucket faking a save collision) is LATENT
  # here, not currently manifesting. The fix removes it BY CONSTRUCTION: the
  # instant an active before-delete flow co-exists with an active save-timing flow
  # on one object, the old code would falsely collide them and the new 3-way
  # bucketing does not (proven by the reason.test.ts before-delete tests). WITHOUT
  # the active filter the count inflates as dead versions cry wolf. Firer types via
  # triggersOn on this vault are Flow + ApexTrigger only; componentTypes scopes the
  # count to Flow (ApexTrigger is a separate concern the coarse
  # automation_build_advisor covers).
  # The claim DISCLOSES the real count N (a 2-flow object reads mild, a 16-flow
  # object strong — self-disclosing), names the FLOWS as the thing to consolidate
  # (the object is context, never a culprit), and renders the ACTUAL context
  # ({timing} = before-save / after-save / before-delete), NEVER a hardcoded "save
  # phase" that would be false on the delete path. maxConfidence declared: a
  # record-trigger `triggersOn` edge is declared (parsed from the flow's <start>),
  # so weakest() keeps declared unless a weaker edge appears.
  #
  # DML-EVENT SPLIT (REASONING-STACKED-FLOWS-IGNORES-RECORD-TRIGGER-TYPE):
  # `eventSplitByProperty: recordTriggerType` refines each timing bucket by the
  # concrete DML operation a flow fires on. Two flows only "run in an undefined
  # order on one save" when they fire on the SAME operation, so a Create-only flow
  # (insert) and an Update-only flow (update) in the same timing are MUTUALLY
  # EXCLUSIVE and must NOT be reported as a collision. The engine buckets by
  # (timing, DML event): a `CreateAndUpdate` flow counts in BOTH insert and update,
  # a `Create` flow only in insert, an `Update` flow only in update; a before-delete
  # flow is always the single `delete` event. Sub-buckets with IDENTICAL membership
  # (an all-CreateAndUpdate stack that collides on both insert and update with the
  # same flow set) merge into ONE claim ("insert or update"), so the common case is
  # not doubled; a mixed stack stays separate honest claims (e.g. insert 3 / update
  # 2). Real-vault probe (WITH the event split): of 22 (object,timing) buckets that
  # fired pre-split, 3 were pure Create-only + Update-only PAIRS that no longer fire
  # (a fabricated 2-flow collision each), and the inflated counts on the rest drop
  # to their true per-event max (e.g. a 16-flow after-save bucket → insert 10 /
  # update 14, never a phantom 16). The claim renders {timing} AND {event} (the DML
  # operation) so it states exactly what co-fires.
  - id: rule:automation/stacked-record-triggered-flows
    concept: concept:automation-collision
    bind:
      edgeType: triggersOn
      componentTypes:
        - Flow
      aggregate:
        groupByEdgeProperty: triggerType
        eventSplitByProperty: recordTriggerType
        endpointWhereProperty:
          key: status
          equals: Active
        op: gte
        threshold: 2
    interpretation: '{object} runs {count} active record-triggered {timing} flows that co-fire on the {event} operation: {ids}. Salesforce best practice is one record-triggered flow per object per {timing} context. Their relative run order is UNDEFINED unless an explicit Flow Trigger Order (a 1–2000 value, GA since Spring ''22) is set on each — set trigger order to make the sequence deterministic, and/or consolidate to reduce maintenance load. (This model does not extract triggerOrder, so it cannot confirm whether ordering is already configured — verify before assuming the order is undefined.) If this is a managed-package object you may not be able to change its automation.'
    maxConfidence: declared
    absenceShaped: false
    dependsOnCoverage:
      - Flow
