    concept: concept:view-modify-all
    bind:
      edgeType: grantedBy
      # Cites ONLY endpoints whose node RESOLVES in the slice to one of these types
      # (the granting PermissionSet/Profile and the CustomObject). A grant on an
      # object NOT retrieved into the vault is dropped from the citation, never
