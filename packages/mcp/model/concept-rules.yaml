        key: viewAllRecords
        equals: true
    interpretation: 'Object-level View All Records grant among {ids}: a permission set or profile grants "View All Records" on an object, so any user who HOLDS that permission set/profile can READ every record of that object regardless of the org-wide default, sharing rules, the role hierarchy, or manual shares — this OVERRIDES the object''s record-level sharing even when its org-wide default reads Private. The cited ids are the two endpoints of this grant relationship: the granting permission set(s)/profile(s) and the object they apply to (when many ids are cited on one object, they are the ENUMERATED SET of permission sets/profiles that each grant View All on it, not a per-grant alarm). BOUNDARIES: this is OBJECT-LEVEL only and does NOT bypass FIELD-LEVEL SECURITY (a field the holder cannot see stays hidden); it is NOT the org-wide "View All Data" SYSTEM permission, which is broader and separate — this applies only to THIS object and says nothing about any other; and it is the DECLARED grant read from metadata, NOT a proof that any specific user actually holds that permission set/profile (an assignment question the offline vault cannot answer) or a proven per-user access outcome for a record. For a specific user, use the why-cant-user-see-record tool.'
