# Concept model — safe-to-delete-field edge semantics (RM-1b DATA track).
#
# CURATOR-OWNED source of truth. General Salesforce truth only: bare
# ComponentType names, bare edge-type names, one extractor source marker
# (`formula-tokenizer`), and the (category, verdict) pair each combination maps
# to. NO org identifiers, NO canonical-id (Type:Name) strings.
#
# This is the per-edge classification `sfi.safe_to_delete_field` applies to each
# incoming dependency edge (`classifyEdge`). It is DATA the tool looks up, not a
# reasoning-engine rule set — the verdict lattice, per-category aggregation,
# coverage caveat, and PII logic stay in the tool. Unifying only the per-edge
# (edgeType, sourceType) -> {category, verdict} mapping here keeps the tool's
# response byte-identical while making the semantics a single curated table.
#
# Compiled to TypeScript by packages/mcp/scripts/build-concept-model.mjs
#   ->  packages/mcp/src/knowledge/generated/concept-model.ts  (DO NOT hand-edit).
# Regenerate:  pnpm regen:concept-model      Parity gate:  pnpm check:concept-model
#
# Evaluation order (mirrors classifyEdge exactly):
#   1. bySource[]        - ordered SPECIAL cases, checked FIRST, keyed on the
#      extractor `source` marker (plus an optional `fromType` scope). First
#      match wins.
#   2. byEdgeType[edgeType].bySourceType[sourceType]  - the per-edge-type table
#      keyed by the referrer node's ComponentType.
#   3. byEdgeType[edgeType].default  - fallback when the edge type is known but
#      the source ComponentType is not in bySourceType.
#   4. default  - fallback when the edge type itself is not in byEdgeType.
#
# Key ORDER is significant and preserved verbatim into the generated artifact.

edgeSemantics:
  # 1. SPECIAL cases, evaluated IN ORDER before the per-edge-type table below.
  #    Keyed on the extractor `source` marker, because `references` is emitted by
  #    several producers whose semantics differ and whose referrer ComponentType
  #    does NOT distinguish them. `fromType`, when present, additionally scopes
  #    the rule to one referrer type.
  #
  #    This list replaced a single hard-coded `formulaTokenizer` case plus a
  #    `references.bySourceType.CustomField -> rollup` entry. That entry was
  #    written when the formula tokenizer was the only OTHER field->field
  #    `references` producer; adding `relationship-resolver` made it a third, and
  #    every resolved formula traversal was then reported to the user as a
  #    roll-up summary that does not exist — a fabricated citation on a correct
  #    verdict. Keying on `source` is what keeps the citation truthful.
  bySource:
    # A formula FIELD's tokenized reference. Beats the frontend `references`
    # rows below, which is why it is evaluated first.
    #
    # SCOPED to CustomField. The same tokenizer also runs over a ValidationRule's
    # `errorConditionFormula`, and while this rule was unscoped EVERY validation
    # rule reached `formula` — the note for which says "Another formula field
    # references this field", false for a validation rule. That made the
    # `references.bySourceType.ValidationRule -> validation` row below DEAD in
    # production (no extractor mints a ValidationRule `references` edge under any
    # other source marker), so the truthful `validation` category and its written
    # note were unreachable, and field_360 — which checks the referrer TYPE first
    # — labelled the identical edge differently. Scoping here reaches the
    # ValidationRule row and closes both.
    - source: formula-tokenizer
      edgeType: references
      fromType: CustomField
      category: formula
      verdict: blocking
    # Roll-up summary coupling: summarizedField / summaryForeignKey /
    # summaryFilterItems, all declared on the PARENT object's field file.
    - source: rollup-summary
      edgeType: references
      category: rollup
      verdict: blocking
    # A cross-object formula traversal (`Parent__r.Field__c`) resolved at import
    # time. Semantically a formula reference — the referencing formula stops
    # compiling — so it shares the `formula` category rather than inventing one.
    # SCOPED to CustomField on purpose: the same resolver also emits FlexiPage
    # related-list alias edges, which are a UI dependency and must keep falling
    # through to `references.bySourceType.FlexiPage -> ui`.
    - source: relationship-resolver
      edgeType: references
      fromType: CustomField
      category: formula
      verdict: blocking

  # 2/3. Per-edge-type classification. Each entry:
  #   bySourceType - referrer ComponentType -> {category, verdict}
  #   default      - fallback for a source ComponentType not listed above
  byEdgeType:
    readsFrom:
      bySourceType:
        ApexClass:
          category: apex
          verdict: risky
        ApexTrigger:
          category: apex
          verdict: risky
        Flow:
          category: flow
          verdict: blocking
        # A synthetic ConditionalContext is the parsed condition of a Flow entry
        # criterion, workflow-rule criterion, validation-rule condition or Flow
        # decision. Its `readsFrom` edges name the fields the condition TESTS.
        # The platform refuses to delete a field any live condition evaluates —
        # and the `firesWhen` edge runs firer -> context, so this is the only
        # edge that reaches the field at all.
        ConditionalContext:
          category: condition
          verdict: blocking
        LightningComponentBundle:
          category: frontend
          verdict: risky
        AuraDefinitionBundle:
          category: frontend
          verdict: risky
      default:
        category: unknown
        verdict: risky
    writesTo:
      bySourceType:
        ApexClass:
          category: apex
          verdict: blocking
        ApexTrigger:
          category: apex
          verdict: blocking
        Flow:
          category: flow
          verdict: blocking
        WorkflowRule:
          category: workflow
          verdict: blocking
        LightningComponentBundle:
          category: frontend
          verdict: risky
        AuraDefinitionBundle:
          category: frontend
          verdict: risky
      default:
        category: unknown
        verdict: blocking
    references:
      bySourceType:
        ValidationRule:
          category: validation
          verdict: blocking
        VisualforcePage:
          category: frontend
          verdict: risky
        VisualforceComponent:
          category: frontend
          verdict: risky
        QuickAction:
          category: layout
          verdict: risky
        Report:
          category: analytics
          verdict: blocking
        Dashboard:
          category: analytics
          verdict: blocking
        ListView:
          category: analytics
          verdict: blocking
        ReportType:
          category: analytics
          verdict: blocking
        FlexiPage:
          category: ui
          verdict: blocking
        RestrictionRule:
          category: sharing
          verdict: blocking
        ScopingRule:
          category: sharing
          verdict: blocking
      default:
        category: unknown
        verdict: risky
    usedInLayout:
      bySourceType: {}
      default:
        category: layout
        verdict: review
    grantedBy:
      bySourceType: {}
      default:
        category: permission
        verdict: review

  # 4. Fallback when the edge type itself is not in byEdgeType.
  default:
    category: unknown
    verdict: risky
