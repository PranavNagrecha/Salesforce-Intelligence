name: CI

# v4.0 regression gate — matches scripts/v4-done-gate.sh (minus integration tests).
# Integration tests require maintainer vaults; run locally with `pnpm test`.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

jobs:
  # INFRA-09: unit tests on Node 20 + 22. Kept as its own job (not folded into
  # build-test's matrix) so the expensive eval/e2e steps stay single-Node.
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all packages)
        run: pnpm -r build

      - name: Typecheck (tsc -b project references)
        run: pnpm tsc

      - name: Unit tests
        run: pnpm -r test

  build-test:
    runs-on: ubuntu-latest
    needs: unit-test
    env:
      EVAL_STRICT: '1'
      SF_INTELLIGENCE_REGISTRY_PATH: eval/registry.ci.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the org-leak scan can check past commits

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Fail fast, before install/build, if a private-org identifier slipped
      # into the tree or git history. The blocklist of real org terms is kept
      # out of the repo; CI materializes it from the ORG_LEAK_BLOCKLIST secret
      # (absent on fork PRs, where only the generic structural check runs).
      - name: Org-leak scan (tree + git history)
        env:
          ORG_LEAK_BLOCKLIST: ${{ secrets.ORG_LEAK_BLOCKLIST }}
        run: |
          if [ -n "$ORG_LEAK_BLOCKLIST" ]; then
            printf '%s' "$ORG_LEAK_BLOCKLIST" > scripts/forbidden-names.local.json
          fi
          node scripts/scan-org-leaks.mjs --strict
          node scripts/scan-org-leaks.mjs --git-history --strict
          rm -f scripts/forbidden-names.local.json

      - name: Public-interface guard (CI/eval reference only in-repo synthetic vaults)
        run: node scripts/check-public-interface.mjs

      # Keeps the hand-rolled path-separator class from regrowing. Three silent
      # Windows defects came from six spellings of "split a path" held in sync
      # by comments; a comment cannot be executed, so this is the drift test
      # that replaces them.
      - name: Portability guard (no hand-rolled path separators)
        run: node scripts/check-portability.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all packages)
        run: pnpm -r build

      - name: CLI bundle size / ANTLR externalization (INFRA-11)
        run: pnpm check:cli-bundle

      - name: Lint
        run: pnpm lint

      - name: Product manifest + doc sync
        run: |
          pnpm product-manifest:check
          pnpm product-surface:check
          pnpm doc-sync
          pnpm skill-gateway

      # Unit tests run on Node 20+22 in the unit-test job (INFRA-09).

      - name: NL routing gate (front-door router → real tools, deterministic)
        run: pnpm eval:routing-gate

      - name: Release privacy guard
        run: pnpm guard

      - name: End-to-end MCP smoke
        run: pnpm e2e

      - name: Build CI eval vault
        run: pnpm eval:build-ci-vault

      - name: Retrieval eval (golden queries)
        run: pnpm eval

      - name: Analytical eval (verdict + trust gates)
        run: pnpm eval:analytical

      - name: Scale gate (resolve latency budget)
        run: pnpm eval:scale

      - name: Scale gate (10k batched import budget)
        run: pnpm eval:scale:import

  # G-5 (0.1.19 finding): the product is npm-distributed to run locally and the
  # admin base is Windows-heavy, but CI ran only on ubuntu — so the Windows
  # `sf.cmd` exec path shipped untested. This job runs the portable subset of
  # the ubuntu gate (checkout -> setup -> install -> build -> unit tests) on a
  # real windows-latest runner.
  #
  # ARMED (0.3.2). It was `if: github.event_name == 'workflow_dispatch'` — i.e.
  # it never ran on push or PR — and additionally excluded four tests and three
  # whole cli test files. That combination is what allowed three silent Windows
  # defects to ship at once: EmailTemplates extracting to zero rows, the
  # `review-change` deploy gate returning `safe` without parsing anything, and
  # the `~` username redaction never firing. The gate was disarmed at exactly
  # the files carrying the bugs.
  #
  # The exclusions are gone rather than moved: the four platform-fragile tests
  # are now `describe.skipIf(process.platform === 'win32')` in their own source,
  # where the skip is visible to the reader, and the rest were rewritten to
  # DERIVE their expectations from `node:path` instead of hardcoding a POSIX
  # rendering. A CI-only `-t` filter hides an exclusion; a `skipIf` declares it.
  #
  # Deliberately NOT folded into the ubuntu job via `strategy.matrix`: that job's
  # remaining steps (org-leak history scan, NL routing gate, e2e MCP smoke, CI
  # vault build, the evals) need maintainer vaults, the `sf` CLI, network access
  # or bash-scripted secrets — none reproducible on a hosted runner. Lint is
  # skipped here too: ESLint over TypeScript sources is OS-independent and the
  # ubuntu job already runs it. duckdb ships prebuilt win32-x64 AND win32-arm64
  # bindings (both pinned in pnpm-lock.yaml), so the native load is not a blocker.
  windows-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        # No fetch-depth: 0 — this job doesn't run the org-leak history scan.

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all packages)
        run: pnpm -r build

      # ADVISORY, and running on every push — which is the change that matters.
      # Until 0.3.2 this job was `workflow_dispatch`-only, so Windows was never
      # exercised at all and three silent defects shipped. It now runs always
      # and reports, but does not block, because the two things still failing
      # are RUNNER PERFORMANCE rather than correctness:
      #
      #   - one explain-flow case took 23.7s, then 48s on a re-run, against
      #     ceilings of 20s then 45s. It is growing, so it is contention, not a
      #     fixed cost — raising the number again would be chasing it.
      #   - `graph`: teardown ENOTEMPTY (fixtures rmdir without closing the
      #     DuckDB handle), a second handle opened to a held database, and the
      #     10k-node scale import at ~99s against a 90s budget.
      #
      # Neither is a product bug and both need work in the graph/test layer,
      # which is a different project from the onboarding path this branch is
      # about. Advisory rather than excluded, deliberately: the failures stay
      # VISIBLE in the log so the debt is tracked, instead of being silently
      # filtered the way this whole job used to be.
      #
      # TO PROMOTE TO A HARD GATE: fix the fixture teardown + the two perf
      # budgets, then delete the two `continue-on-error` lines below.
      - name: Unit tests (advisory — all packages except graph)
        # PATH filters, not name filters: the repo root and packages/cli are both
        # named `sf-intelligence`, so a name filter would let the ROOT package
        # through — and the root's `test` script also runs test:integration,
        # which needs maintainer vaults and cannot pass on a hosted runner.
        run: pnpm --filter './packages/*' --filter '!./packages/graph' -r test
        continue-on-error: true

      # ADVISORY: `graph` has three PRE-EXISTING Windows problems, none of them
      # correctness bugs in the product, and all of them needing work in the
      # graph layer rather than the onboarding path:
      #
      #   1. teardown `ENOTEMPTY` — several fixtures rmdir a temp directory
      #      without closing the DuckDB handle first. Node's rm retries
      #      (added in 0.3.2) are not enough because the handle is never
      #      closed, only garbage-collected; the fix is an explicit
      #      `closeGraph` in those fixtures.
      #   2. `Cannot open file ... used by another process` — the resolve-index
      #      persistence test opens a second handle to a database the first
      #      test still holds. Legal on POSIX, never on Windows.
      #   3. perf budgets — the 10k-node scale import takes ~99s against a 90s
      #      budget on a windows-latest runner, and two scoped-prune tests
      #      exceed the 60s vitest default. DuckDB is simply slower here; the
      #      budgets were calibrated on POSIX.
      #
      # Advisory rather than excluded: the failures stay VISIBLE in the log so
      # the debt is tracked, instead of being silently filtered the way this
      # whole job used to be. Promote to the hard gate above once graph is fixed.
      - name: Unit tests (advisory — graph, see comment)
        run: pnpm --filter './packages/graph' test
        continue-on-error: true

  # #11: the dev box is macOS and darwin-arm64/darwin-x64 are shipped DuckDB
  # native binaries (@duckdb/node-bindings-darwin-arm64 / -darwin-x64 are
  # pinned in pnpm-lock.yaml alongside the win32/linux ones), yet until now CI
  # only ever ran on ubuntu-latest and windows-latest — no macOS runner ever
  # exercised the native module load or the POSIX exec path on Darwin
  # specifically. This job mirrors the windows-build-test job's PORTABLE
  # subset (checkout → pnpm/node setup → install → build → unit tests) on a
  # real macos-latest runner as a REAL gate (no continue-on-error). Same
  # rationale as the Windows job for keeping this separate rather than a
  # `strategy.matrix` fold-in: the ubuntu job's remaining steps (org-leak
  # git-history scan, public-interface guard, NL routing gate, e2e MCP smoke,
  # CI vault build, the retrieval/analytical/scale evals) need maintainer
  # vaults, the `sf` CLI, network access, or bash-scripted secret handling —
  # none of that is reproducible on a hosted runner, matrix or not. Lint is
  # skipped here too, same reasoning as the Windows job: `pnpm lint` is
  # OS-independent and already covered by the ubuntu job.
  #
  # macOS is POSIX, so nothing is platform-skipped here; the full unit-test
  # suite runs unmodified. As of 0.3.2 the Windows job runs the full suite too —
  # its platform-specific skips live in the test sources, not in this file.
  macos-build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        # No fetch-depth: 0 here — this job doesn't run the org-leak history
        # scan, so a shallow checkout is fine and faster.

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all packages)
        run: pnpm -r build

      - name: Unit tests
        run: pnpm -r test
