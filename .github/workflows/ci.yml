name: CI

# v4.0 regression gate — matches scripts/v4-done-gate.sh (minus integration tests).
# Integration tests require maintainer vaults; run locally with `pnpm test`.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

jobs:
  # INFRA-09: unit tests on Node 20 + 22. Kept as its own job (not folded into
  # build-test's matrix) so the expensive eval/e2e steps stay single-Node.
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all packages)
        run: pnpm -r build

      - name: Typecheck (tsc -b project references)
        run: pnpm tsc

      - name: Unit tests
        run: pnpm -r test

  build-test:
    runs-on: ubuntu-latest
    needs: unit-test
    env:
      EVAL_STRICT: '1'
      SF_INTELLIGENCE_REGISTRY_PATH: eval/registry.ci.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the org-leak scan can check past commits

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Fail fast, before install/build, if a private-org identifier slipped
      # into the tree or git history. The blocklist of real org terms is kept
      # out of the repo; CI materializes it from the ORG_LEAK_BLOCKLIST secret
      # (absent on fork PRs, where only the generic structural check runs).
      - name: Org-leak scan (tree + git history)
        env:
          ORG_LEAK_BLOCKLIST: ${{ secrets.ORG_LEAK_BLOCKLIST }}
        run: |
          if [ -n "$ORG_LEAK_BLOCKLIST" ]; then
            printf '%s' "$ORG_LEAK_BLOCKLIST" > scripts/forbidden-names.local.json
          fi
          node scripts/scan-org-leaks.mjs --strict
          node scripts/scan-org-leaks.mjs --git-history --strict
          rm -f scripts/forbidden-names.local.json

      - name: Public-interface guard (CI/eval reference only in-repo synthetic vaults)
        run: node scripts/check-public-interface.mjs

      # Portability guard (no hand-rolled path separators) moved to the
      # windows-build-test job in 0.3.3: it guards against a bug class that
      # is invisible on POSIX (a hand-rolled '/' is correct there by
      # accident), so it now runs on the platform it actually protects
      # instead of ubuntu.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Anti-backslide gate over THIS FILE (ci.yml) itself — see
      # test/ci-workflow-invariants.test.ts at the repo root for what it
      # checks and why it lives outside any package. No root-level `test/`
      # vitest project exists (pnpm-workspace.yaml only lists `packages/*`),
      # so it is not picked up by `pnpm -r test` or `pnpm test:integration`;
      # it is invoked directly here instead. Needs only `pnpm install`
      # (vitest is a root devDependency), not a build.
      - name: CI workflow invariants (anti-backslide gate)
        run: pnpm exec vitest run test/ci-workflow-invariants.test.ts

      - name: Build (all packages)
        run: pnpm -r build

      - name: CLI bundle size / ANTLR externalization (INFRA-11)
        run: pnpm check:cli-bundle

      - name: Lint
        run: pnpm lint

      - name: Product manifest + doc sync
        run: |
          pnpm product-manifest:check
          pnpm product-surface:check
          pnpm doc-sync
          pnpm skill-gateway

      # Unit tests run on Node 20+22 in the unit-test job (INFRA-09).

      - name: NL routing gate (front-door router → real tools, deterministic)
        run: pnpm eval:routing-gate

      - name: Release privacy guard
        run: pnpm guard

      - name: End-to-end MCP smoke
        run: pnpm e2e

      - name: Build CI eval vault
        run: pnpm eval:build-ci-vault

      - name: Retrieval eval (golden queries)
        run: pnpm eval

      - name: Analytical eval (verdict + trust gates)
        run: pnpm eval:analytical

      - name: Scale gate (resolve latency budget)
        run: pnpm eval:scale

      - name: Scale gate (10k batched import budget)
        run: pnpm eval:scale:import

  # G-5 (0.1.19 finding): the product is npm-distributed to run locally and the
  # admin base is Windows-heavy, but CI ran only on ubuntu — so the Windows
  # `sf.cmd` exec path shipped untested. This job runs the portable subset of
  # the ubuntu gate (checkout -> setup -> install -> build -> unit tests) on a
  # real windows-latest runner.
  #
  # ARMED (0.3.2). It was `if: github.event_name == 'workflow_dispatch'` — i.e.
  # it never ran on push or PR — and additionally excluded four tests and three
  # whole cli test files. That combination is what allowed three silent Windows
  # defects to ship at once: EmailTemplates extracting to zero rows, the
  # `review-change` deploy gate returning `safe` without parsing anything, and
  # the `~` username redaction never firing. The gate was disarmed at exactly
  # the files carrying the bugs.
  #
  # The exclusions are gone rather than moved: the four platform-fragile tests
  # are now `describe.skipIf(process.platform === 'win32')` in their own source,
  # where the skip is visible to the reader, and the rest were rewritten to
  # DERIVE their expectations from `node:path` instead of hardcoding a POSIX
  # rendering. A CI-only `-t` filter hides an exclusion; a `skipIf` declares it.
  #
  # Deliberately NOT folded into the ubuntu job via `strategy.matrix`: that job's
  # remaining steps (org-leak history scan, NL routing gate, e2e MCP smoke, CI
  # vault build, the evals) need maintainer vaults, the `sf` CLI, network access
  # or bash-scripted secrets — none reproducible on a hosted runner. Lint is
  # skipped here too: ESLint over TypeScript sources is OS-independent and the
  # ubuntu job already runs it. duckdb ships prebuilt win32-x64 AND win32-arm64
  # bindings (both pinned in pnpm-lock.yaml), so the native load is not a blocker.
  #
  # 0.3.3: this job was GREEN over a red log — both unit-test steps below carry
  # `continue-on-error: true`, so a packages/mcp crash (0xC0000409, see WIN-1)
  # never turned the check red, and the majority of the MCP tool surface has
  # never actually executed on Windows. Three fixes: (1) the portability guard
  # moved in from the ubuntu job, first, before install/build spend any time,
  # because it protects THIS platform; (2) a third step runs seven packages
  # that carry no DuckDB dependency and already pass 100% here (core,
  # tooling-api, renderers, parsers, patterns, vault, extractors — the same
  # surface that held all three defects this job was created to catch) as a
  # HARD gate, no continue-on-error; (3) the two remaining advisory steps got
  # their comments rewritten — the old ones blamed "runner performance" for a
  # failure that is a native crash, which test/ci-workflow-invariants.test.ts
  # (repo root) now mechanically forbids: every `continue-on-error: true` in
  # this file must sit next to a named WIN-<n> blocker with a DoD, and the
  # hard-gate package list and the continue-on-error count can only grow
  # stricter, never looser, without that test failing.
  windows-build-test:
    runs-on: windows-latest
    # The hard-gated Windows package list lives HERE, once, and is consumed by
    # both the hard-gate step's `--filter` list and the attestation step's
    # machine-readable report. test/ci-workflow-invariants.test.ts asserts the
    # two agree exactly, so the report can never claim coverage the gate did
    # not actually run.
    env:
      WIN_HARD_TIER_PACKAGES: core,tooling-api,renderers,parsers,patterns,vault,extractors
    steps:
      - uses: actions/checkout@v4
        # No fetch-depth: 0 — this job doesn't run the org-leak history scan.

      # Moved from the ubuntu build-test job in 0.3.3: this is a plain-text
      # guard over checked-out .ts sources — no install, no build needed — and
      # it exists specifically to catch a bug class that is invisible on
      # ubuntu, where a hand-rolled '/' already happens to be correct by
      # accident. Runs on the platform it protects, first, before
      # install/build spend any time.
      - name: Portability guard (no hand-rolled path separators)
        run: node scripts/check-portability.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all packages)
        run: pnpm -r build

      # HARD GATE — no continue-on-error. These seven packages carry no
      # DuckDB dependency and already pass 100% on windows-latest per CI run
      # 32974713874 (core 4, tooling-api 6, renderers 10, parsers 9,
      # patterns 3, vault 11, extractors 87 — all green, 130 test files, 0
      # failures). It is also where all three Windows defects fixed in 0.3.2
      # lived (EmailTemplates extraction, the review-change deploy gate, the
      # `~` username redaction) — the free, already-proven-safe slice of the
      # surface, carved out so it blocks on its own instead of riding inside
      # an advisory step where a packages/mcp crash could mask a regression
      # here.
      - name: Unit tests (hard gate — no-DuckDB packages)
        id: win_hard_gate
        # PATH filters — see the note on the advisory step below for why a
        # name filter is unsafe here too.
        run: pnpm --filter './packages/core' --filter './packages/tooling-api' --filter './packages/renderers' --filter './packages/parsers' --filter './packages/patterns' --filter './packages/vault' --filter './packages/extractors' -r test

      # ADVISORY, and running on every push. Until 0.3.2 this job was
      # `workflow_dispatch`-only, so Windows was never exercised at all and
      # three silent defects shipped. It now runs always and reports, but
      # does not block, because packages/mcp does not fail a test here — it
      # never gets the chance to:
      #
      #   packages/mcp exits with Windows status 3221226505 (0xC0000409,
      #   __fastfail) mid-run, inside the bounded-graph-query suite behind
      #   fieldLineageHandler, and prints NO test summary at all — unlike
      #   every other package this filter covers (core, tooling-api,
      #   renderers, parsers, patterns, vault, extractors all print
      #   `Test Files N passed (N)`; see the hard gate above). That is a
      #   native abort, not slow hardware. 0.3.2's response was to raise
      #   packages/mcp's testTimeout 20s -> 45s, on the theory that a slower
      #   runner just needed more headroom. It did not work — CI run
      #   32974713874 on main still shows the same crash — because a longer
      #   clock does not change what happens once the query IS killed. 0.3.3
      #   tried `pool: 'forks'` in packages/mcp/vitest.config.ts (isolate the
      #   abort to a child process instead of a worker thread sharing the
      #   parent's failure mode); it measured ~77% slower wall-clock on macOS
      #   for no observed correctness change and was NOT adopted — see that
      #   file's comment for the numbers. Unverified on an actual Windows
      #   runner either way; it may or may not matter there.
      #
      #   WIN-1  packages/mcp exits 0xC0000409, no test summary.
      #          DoD: Windows prints `Test Files N passed (N)` with N equal
      #          to the Linux count.
      #
      # Advisory rather than excluded, deliberately: the failure stays
      # VISIBLE in the log so the debt is tracked, instead of being silently
      # filtered the way this whole job used to be.
      #
      # TO PROMOTE TO A HARD GATE: close WIN-1, then delete the two
      # `continue-on-error` lines below (this step and the graph step).
      - name: Unit tests (advisory — all packages except graph)
        id: win_advisory_all
        # PATH filters, not name filters: the repo root and packages/cli are both
        # named `sf-intelligence`, so a name filter would let the ROOT package
        # through — and the root's `test` script also runs test:integration,
        # which needs maintainer vaults and cannot pass on a hosted runner.
        run: pnpm --filter './packages/*' --filter '!./packages/graph' -r test
        continue-on-error: true

      # ADVISORY: `graph` has three PRE-EXISTING Windows problems, none of them
      # correctness bugs in the product, and all of them needing work in the
      # graph layer rather than the onboarding path. Tracked as WIN-2:
      #
      #   1. teardown `ENOTEMPTY` — several fixtures rmdir a temp directory
      #      without closing the DuckDB handle first. Node's rm retries
      #      (added in 0.3.2) are not enough because the handle is never
      #      closed, only garbage-collected; the fix is an explicit
      #      `closeGraph()` in those fixtures. IN PROGRESS on another lane of
      #      this fix fleet against the four fixture sites — do not duplicate
      #      that work here.
      #   2. `Cannot open file ... used by another process` — the resolve-index
      #      persistence test opens a second handle to a database the first
      #      test still holds. Legal on POSIX, never on Windows.
      #   3. perf budgets — the 10k-node scale import takes ~99s against a 90s
      #      budget on a windows-latest runner, and two scoped-prune tests
      #      exceed the 60s vitest default. DuckDB is simply slower here; the
      #      budgets were calibrated on POSIX.
      #
      #   WIN-2  no `closeGraph()` releasing the DuckDB instance in graph
      #          fixtures. DoD: all three items above are fixed and this step
      #          runs with no `continue-on-error`.
      #
      # Advisory rather than excluded: the failures stay VISIBLE in the log so
      # the debt is tracked, instead of being silently filtered the way this
      # whole job used to be. Promote to the hard gate above once WIN-2 closes.
      - name: Unit tests (advisory — graph, see comment)
        id: win_advisory_graph
        run: pnpm --filter './packages/graph' test
        continue-on-error: true

      # ── THE JOB SAYING WHAT ITS OWN GREEN TICK MEANS ──────────────────────
      # Everything above this line can pass while `packages/mcp` aborts with
      # 0xC0000409 and `packages/graph` fails outright, because those two steps
      # are advisory. That is a deliberate tier and it stays. What was wrong is
      # that the tier was invisible downstream: publish.yml gates the npm
      # release on this workflow concluding `success`, and `success` here meant
      # either "Windows passed" or "Windows was allowed to fail" with no way to
      # tell the two apart. A release gate that fails closed on an unreadable
      # API was, at the same time, asserting a platform result it had not
      # checked.
      #
      # So the job now emits its own scope. `steps.<id>.outcome` is the result
      # BEFORE `continue-on-error` is applied — the honest one — so this report
      # records what each tier actually did, not what the tick was allowed to
      # say. publish.yml downloads it and refuses to publish if it is missing,
      # unreadable, or says the hard tier did not pass; when an advisory tier
      # is red it still publishes (advisory is a real tier) but stamps the
      # partial coverage into the GitHub release body, permanently, instead of
      # into a log line nobody reads afterwards.
      #
      # `if: always()` on purpose: the report is most needed exactly when
      # something above failed. It does not rescue a failed hard gate — this
      # step exiting 0 cannot un-fail an earlier step.
      - name: Windows tier attestation (what a green tick on this job covers)
        id: win_attestation
        if: always()
        shell: bash
        env:
          WIN_HARD_GATE_OUTCOME: ${{ steps.win_hard_gate.outcome }}
          WIN_ADVISORY_ALL_OUTCOME: ${{ steps.win_advisory_all.outcome }}
          WIN_ADVISORY_GRAPH_OUTCOME: ${{ steps.win_advisory_graph.outcome }}
        run: |
          set -euo pipefail

          node - > windows-tier-report.json <<'NODE'
          const env = process.env;
          const outcome = (v) => (v && v.length > 0 ? v : 'unknown');
          const hardGate = {
            id: 'win_hard_gate',
            step: 'Unit tests (hard gate - no-DuckDB packages)',
            packages: (env.WIN_HARD_TIER_PACKAGES || '').split(',').map((p) => p.trim()).filter(Boolean),
            outcome: outcome(env.WIN_HARD_GATE_OUTCOME),
          };
          const advisory = [
            {
              id: 'win_advisory_all',
              step: 'Unit tests (advisory - all packages except graph)',
              blocker: 'WIN-1',
              outcome: outcome(env.WIN_ADVISORY_ALL_OUTCOME),
            },
            {
              id: 'win_advisory_graph',
              step: 'Unit tests (advisory - graph)',
              blocker: 'WIN-2',
              outcome: outcome(env.WIN_ADVISORY_GRAPH_OUTCOME),
            },
          ];
          const notGreen = advisory.filter((a) => a.outcome !== 'success');
          process.stdout.write(
            JSON.stringify(
              {
                schema: 1,
                job: 'windows-build-test',
                runner: 'windows-latest',
                repository: env.GITHUB_REPOSITORY,
                sha: env.GITHUB_SHA,
                runId: env.GITHUB_RUN_ID,
                runAttempt: env.GITHUB_RUN_ATTEMPT,
                hardGate,
                advisory,
                advisoryNotGreen: notGreen.map((a) => a.blocker + '=' + a.outcome),
                windowsFullyVerified: hardGate.outcome === 'success' && notGreen.length === 0,
              },
              null,
              2,
            ) + '\n',
          );
          NODE

          cat windows-tier-report.json

          FULLY="$(node -p "require('./windows-tier-report.json').windowsFullyVerified")"
          {
            echo "### Windows tier attestation"
            echo
            echo "| tier | blocker | outcome (before continue-on-error) |"
            echo "| --- | --- | --- |"
            echo "| hard gate: ${WIN_HARD_TIER_PACKAGES} | - | ${WIN_HARD_GATE_OUTCOME} |"
            echo "| advisory: all packages except graph | WIN-1 | ${WIN_ADVISORY_ALL_OUTCOME} |"
            echo "| advisory: graph | WIN-2 | ${WIN_ADVISORY_GRAPH_OUTCOME} |"
            echo
            echo "\`windowsFullyVerified\`: **${FULLY}**"
            echo
            echo "A green tick on this job does NOT by itself mean Windows passed:"
            echo "the advisory tiers above may be red. publish.yml reads this report"
            echo "(artifact \`windows-tier-report\`) rather than the tick."
          } >> "$GITHUB_STEP_SUMMARY"

      # publish.yml's Windows-scope gate downloads this by name and FAILS
      # CLOSED if it is absent — deleting this step does not make the release
      # gate lenient, it makes it refuse. `if-no-files-found: error` so an
      # empty upload cannot masquerade as a present one.
      - name: Upload the Windows tier attestation (publish.yml reads this)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tier-report
          path: windows-tier-report.json
          if-no-files-found: error
          retention-days: 90

  # #11: the dev box is macOS and darwin-arm64/darwin-x64 are shipped DuckDB
  # native binaries (@duckdb/node-bindings-darwin-arm64 / -darwin-x64 are
  # pinned in pnpm-lock.yaml alongside the win32/linux ones), yet until now CI
  # only ever ran on ubuntu-latest and windows-latest — no macOS runner ever
  # exercised the native module load or the POSIX exec path on Darwin
  # specifically. This job mirrors the windows-build-test job's PORTABLE
  # subset (checkout → pnpm/node setup → install → build → unit tests) on a
  # real macos-latest runner as a REAL gate (no continue-on-error). Same
  # rationale as the Windows job for keeping this separate rather than a
  # `strategy.matrix` fold-in: the ubuntu job's remaining steps (org-leak
  # git-history scan, public-interface guard, NL routing gate, e2e MCP smoke,
  # CI vault build, the retrieval/analytical/scale evals) need maintainer
  # vaults, the `sf` CLI, network access, or bash-scripted secret handling —
  # none of that is reproducible on a hosted runner, matrix or not. Lint is
  # skipped here too, same reasoning as the Windows job: `pnpm lint` is
  # OS-independent and already covered by the ubuntu job.
  #
  # macOS is POSIX, so nothing is platform-skipped here; the full unit-test
  # suite runs unmodified. As of 0.3.2 the Windows job runs the full suite too —
  # its platform-specific skips live in the test sources, not in this file.
  macos-build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        # No fetch-depth: 0 here — this job doesn't run the org-leak history
        # scan, so a shallow checkout is fine and faster.

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all packages)
        run: pnpm -r build

      - name: Unit tests
        run: pnpm -r test
