name: Publish (npm Trusted Publishing)

# Publishes `sf-intelligence` to npm on a version tag push, keyless via OIDC.
# NO NPM TOKEN is used or stored: npm Trusted Publishing exchanges the GitHub
# Actions OIDC identity for a short-lived publish credential, and provenance is
# attached automatically.
#
# ONE-TIME SETUP (npmjs.com, done by the package owner — cannot be automated):
#   npmjs.com -> package `sf-intelligence` -> Settings -> Trusted Publishing
#   -> add a GitHub Actions publisher:
#        Organization/user: PranavNagrecha
#        Repository:        Salesforce-Intelligence
#        Workflow filename: publish.yml
#   (leave Environment blank to match this workflow, or set one and add
#    `environment:` below to match). Must be configured BEFORE pushing the tag,
#    or the publish step fails auth (re-runnable after).
#
# To release: push an annotated tag `vX.Y.Z` whose version matches
# packages/cli/package.json (the prepublishOnly guard enforces the match).
# The tagged COMMIT must already have a green CI run — see the CI-green gate
# below. CI (ci.yml) triggers on push to `main` / `release/**` and on
# pull_request; it does NOT trigger on tags. Tag a commit that CI has covered.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bypass_ci_check:
        description: 'DANGER — publish WITHOUT a verified green CI run on this commit. Only for re-driving a release whose CI history has aged out. Logged loudly.'
        type: boolean
        default: false
        required: false

permissions:
  contents: write # create/update the GitHub release for the tag
  id-token: write # npm Trusted Publishing (OIDC) + provenance, and MCP Registry OIDC
  actions: read # CI-green gate: list ci.yml workflow runs for the tagged SHA
  checks: read # CI-green gate: informational check-run roll-up for the SHA

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # ── CI-GREEN GATE — MUST STAY THE FIRST STEP IN THIS JOB ──────────────
      # This workflow fires on a TAG push. ci.yml fires on push to
      # main/release/** and on pull_request — never on tags. So the two are
      # completely decoupled: before this gate, `git tag v9.9.9 <any-sha> &&
      # git push --tags` published that SHA to npm and the MCP Registry with
      # no guarantee CI had ever run on it, let alone passed.
      #
      # `needs:` CANNOT close that hole: it only orders jobs WITHIN one
      # workflow file, so `needs: [build-test]` here would reference a job
      # that does not exist in this file (a parse error, not a gate). The
      # only cross-workflow mechanism is to ask the API what CI actually did
      # on this exact commit — which is what this step does, and it FAILS
      # CLOSED on every answer except a clean "success".
      #
      #   CI succeeded  -> proceed
      #   CI failed     -> hard fail (named conclusion)
      #   CI running    -> poll up to MAX_WAIT_SECONDS, then hard fail
      #   CI never ran  -> hard fail after NO_RUN_GRACE_SECONDS. This is the
      #                    actual hole; "no run found" is NEVER success.
      #   API unreadable/ci.yml missing -> hard fail (cannot verify == no)
      #
      # Needs no checkout: `gh` and `jq` are preinstalled on ubuntu-latest and
      # every query is by ${{ github.repository }} + $GITHUB_SHA. Runs before
      # install/build so an ungated tag burns seconds, not a publish.
      - name: Require a green CI run on the tagged commit
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Renders 'false' on a tag push (short-circuit), 'true' only when a
          # human ticked the box on a manual run. Empty/absent => not 'true'.
          CI_GATE_BYPASS: ${{ github.event_name == 'workflow_dispatch' && inputs.bypass_ci_check }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA}"
          WORKFLOW_FILE="ci.yml"
          # Grace for a run to APPEAR — covers tagging seconds after a merge,
          # before GitHub has registered the push run.
          NO_RUN_GRACE_SECONDS=300
          # Total budget for CI to FINISH once a run exists (the full gate
          # runs evals; ~20-25 min is normal).
          MAX_WAIT_SECONDS=1800
          POLL_INTERVAL_SECONDS=20

          if [ "${CI_GATE_BYPASS:-}" = "true" ]; then
            echo "::warning title=CI GATE BYPASSED::Manual run with bypass_ci_check=true — publishing ${SHA} WITHOUT a verified green CI run."
            {
              echo "### :warning: CI gate BYPASSED"
              echo
              echo "\`bypass_ci_check=true\` was passed to a manual \`workflow_dispatch\`."
              echo "Commit \`${SHA}\` is being published **without** a verified green CI run."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # The gate is only worth anything if the workflow it points at still
          # exists. A rename/delete must FAIL the publish, never silently pass.
          wf_ok=0
          for attempt in 1 2 3; do
            if gh api "repos/${REPO}/actions/workflows/${WORKFLOW_FILE}" --jq '.id' >/dev/null 2>&1; then
              wf_ok=1
              break
            fi
            echo "Could not read workflow '${WORKFLOW_FILE}' from the API (attempt ${attempt}/3)."
            if [ "${attempt}" -lt 3 ]; then
              sleep 10
            fi
          done
          if [ "${wf_ok}" -ne 1 ]; then
            echo "::error title=CI gate cannot verify::Workflow '${WORKFLOW_FILE}' not found in ${REPO} (renamed, deleted, or API unreachable). Refusing to publish an unverified commit."
            exit 1
          fi

          echo "Checking CI ('${WORKFLOW_FILE}') for ${REPO}@${SHA}"
          start_ts="$(date +%s)"
          api_errors=0
          runs_json=""

          while :; do
            elapsed=$(( $(date +%s) - start_ts ))

            if runs_json="$(gh api "repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?head_sha=${SHA}&per_page=100" 2>/dev/null)"; then
              api_errors=0
            else
              api_errors=$(( api_errors + 1 ))
              echo "GitHub API read failed (${api_errors} consecutive)."
              if [ "${api_errors}" -ge 5 ]; then
                echo "::error title=CI gate cannot verify::5 consecutive GitHub API failures while reading CI status for ${SHA}. Refusing to publish."
                exit 1
              fi
              sleep "${POLL_INTERVAL_SECONDS}"
              continue
            fi

            total="$(jq '.workflow_runs | length' <<<"${runs_json}")"

            # CI NEVER RAN — the exact hole this gate exists to close.
            if [ "${total}" -eq 0 ]; then
              if [ "${elapsed}" -ge "${NO_RUN_GRACE_SECONDS}" ]; then
                echo "::error title=CI never ran on this commit::No '${WORKFLOW_FILE}' run exists for ${SHA} after ${NO_RUN_GRACE_SECONDS}s. CI only runs on push to main / release/** and on pull_request — a tag on any other commit is NOT covered by it. Refusing to publish unverified code."
                exit 1
              fi
              echo "No CI run for ${SHA} yet (${elapsed}s of ${NO_RUN_GRACE_SECONDS}s grace) — waiting."
              sleep "${POLL_INTERVAL_SECONDS}"
              continue
            fi

            # CI STILL RUNNING — a tag pushed right after a merge races the
            # push run, so wait it out rather than failing instantly.
            pending="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"${runs_json}")"
            if [ "${pending}" -gt 0 ]; then
              if [ "${elapsed}" -ge "${MAX_WAIT_SECONDS}" ]; then
                echo "::error title=CI still running::${pending} '${WORKFLOW_FILE}' run(s) for ${SHA} were still in progress after ${MAX_WAIT_SECONDS}s. Refusing to publish on an unfinished CI result — re-run this workflow once CI is green."
                exit 1
              fi
              jq -r '.workflow_runs[] | select(.status != "completed") | "  waiting on run #\(.run_number) [\(.status)] \(.html_url)"' <<<"${runs_json}"
              sleep "${POLL_INTERVAL_SECONDS}"
              continue
            fi

            break
          done

          echo "CI runs found for ${SHA}:"
          jq -r '.workflow_runs | sort_by((.run_started_at // .created_at), .id) | reverse | .[] | "  run #\(.run_number) event=\(.event) conclusion=\(.conclusion // "none") \(.html_url)"' <<<"${runs_json}"

          # CI FAILED — any hard-red run on this SHA blocks, even if a later
          # run went green (a genuine re-run mutates the SAME run in place, so
          # a lingering red run means a different, still-failing attempt).
          red="$(jq '[.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure")] | length' <<<"${runs_json}")"
          if [ "${red}" -gt 0 ]; then
            echo "::error title=CI is red on this commit::${red} '${WORKFLOW_FILE}' run(s) for ${SHA} concluded failure/timed_out/startup_failure (listed above). Fix and re-run CI to green on this exact commit, then re-run this workflow. Refusing to publish."
            exit 1
          fi

          # ...and the newest run must be an outright success. cancelled /
          # skipped / neutral are NOT success and must not publish.
          latest_conclusion="$(jq -r '.workflow_runs | sort_by((.run_started_at // .created_at), .id) | last | (.conclusion // "none")' <<<"${runs_json}")"
          if [ "${latest_conclusion}" != "success" ]; then
            echo "::error title=CI did not succeed::The newest '${WORKFLOW_FILE}' run for ${SHA} concluded '${latest_conclusion}', not 'success'. Only a successful CI run may publish."
            exit 1
          fi

          latest_url="$(jq -r '.workflow_runs | sort_by((.run_started_at // .created_at), .id) | last | .html_url' <<<"${runs_json}")"
          echo "CI is GREEN on ${SHA} — ${latest_url}"

          # Informational only (never fatal): the wider check-run picture for
          # this commit, so a red third-party check is at least visible in the
          # log even though it does not gate the publish.
          echo "Check-runs on ${SHA} (informational):"
          gh api "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | "  \(.name): \(.status)/\(.conclusion // "pending")"' 2>/dev/null || \
            echo "  (check-run roll-up unavailable)"

          {
            echo "### :white_check_mark: CI gate passed"
            echo
            echo "Commit \`${SHA}\` has a green \`${WORKFLOW_FILE}\` run: ${latest_url}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the org-leak guard can scan past commits

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Upgrade npm (>= 11.5.1 for OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      # Privacy guard — REFUSE to publish if any real-org identifier or PII
      # slipped into the tree or git history. Mirrors the CI org-leak gate so
      # the tag-triggered publish is self-guarding, not reliant on CI having
      # run separately on the tagged commit. The blocklist of real org terms is
      # kept out of the repo and materialized from the ORG_LEAK_BLOCKLIST secret
      # (absent → the generic structural patterns still run). This step runs
      # BEFORE publish, so a leak fails the job with nothing pushed to npm.
      - name: Privacy guard (org-leak scan + release guard)
        env:
          ORG_LEAK_BLOCKLIST: ${{ secrets.ORG_LEAK_BLOCKLIST }}
        run: |
          if [ -n "$ORG_LEAK_BLOCKLIST" ]; then
            printf '%s' "$ORG_LEAK_BLOCKLIST" > scripts/forbidden-names.local.json
          fi
          node scripts/scan-org-leaks.mjs --strict
          node scripts/scan-org-leaks.mjs --git-history --strict
          pnpm guard
          rm -f scripts/forbidden-names.local.json

      # Idempotent: a re-run (or a workflow_dispatch against an already-released
      # tag) must not fail the whole job just because this version is on npm.
      # The later steps — GitHub release and MCP registry — are the ones that
      # historically drifted, so they need to be reachable on a re-run.
      - name: Publish sf-intelligence (keyless, with provenance)
        working-directory: packages/cli
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "sf-intelligence@${VERSION}" version >/dev/null 2>&1; then
            echo "sf-intelligence@${VERSION} is already on npm — skipping publish."
          else
            npm publish --provenance --access public
          fi

      # Publish the server manifest to the official MCP Registry, keyless via the
      # same GitHub Actions OIDC identity. Previously this was a MANUAL step and
      # so it silently rotted: the registry sat at 0.1.26 while npm was at 0.2.5,
      # and downstream MCP directories crawl the registry record, propagating the
      # stale version across the ecosystem. Automating it here is the fix.
      # This step used to carry `continue-on-error: true`, for a real reason:
      # `npm publish` above is guarded against re-runs, but the registry rejects
      # a duplicate version outright, so re-running a partially-failed publish
      # died HERE — after npm already had the version — and never reached the
      # SBOM or the GitHub release, stranding the very release this workflow
      # exists to stop cutting by hand.
      #
      # The cost was that EVERY registry failure was swallowed. A green Publish
      # job could leave the official public record on an older version while npm
      # said otherwise, and nothing in the run would say so — the discovery
      # channel rotting silently is precisely the failure mode the registry
      # entry exists to prevent.
      #
      # Both are now satisfied by distinguishing the two cases instead of
      # blanket-ignoring them: an ALREADY-PUBLISHED version is an idempotent
      # re-run and exits 0 with a visible notice; anything else is fatal. The
      # difference between "we already did this" and "this did not work" is
      # exactly what `continue-on-error` erased.
      - name: Publish to the official MCP Registry (keyless OIDC)
        working-directory: packages/cli
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./server.json').version")"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::server.json version ($MANIFEST_VERSION) != package.json version ($VERSION). Bump server.json before tagging."
            exit 1
          fi
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar -xz mcp-publisher
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc

          set +e
          OUT="$(./mcp-publisher publish 2>&1)"
          RC=$?
          set -e
          echo "$OUT"

          if [ "$RC" -eq 0 ]; then
            echo "::notice::MCP Registry: published ${VERSION}."
            exit 0
          fi

          # The ONLY tolerated failure: this exact version is already on the
          # registry, i.e. we are re-running a publish that already got this far.
          if printf '%s' "$OUT" | grep -qiE 'already exists|already published|duplicate version|version .* exists'; then
            echo "::notice::MCP Registry already carries ${VERSION} — idempotent re-run, treating as done."
            exit 0
          fi

          echo "::error::MCP Registry publish FAILED for ${VERSION} and it was NOT a duplicate-version rejection. npm may already have this version, so the public record is now INCONSISTENT: fix the cause and re-run this workflow, which is safe — a genuine duplicate is tolerated above."
          exit "$RC"

      # AUDIT-F10 / Wave 4: real CycloneDX SBOM via cdxgen (pnpm-aware).
      # Fails the publish job if the artifact is missing/empty — SECURITY.md
      # promises an SBOM on the GitHub Release.
      - name: Generate CycloneDX SBOM (AUDIT-F10)
        run: pnpm sbom

      # Cut the GitHub release. This step did not exist before, which is why
      # every previous release had to be created by hand — a tag would publish to
      # npm and GitHub would keep showing an older release as "Latest". Notes are
      # lifted from the matching CHANGELOG section so they cannot drift from it.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) echo "Not a version tag ($TAG) — skipping release."; exit 0 ;;
          esac
          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          # Extract just this version's CHANGELOG section (## [x.y.z] ... next ##).
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          # GitHub rejects a release body over 125,000 characters with HTTP 422.
          # v0.3.1's section was 139,898 and the release had to be cut by hand.
          # Trim on a LINE boundary so the body never ends mid-sentence, leave
          # headroom for the pointer, and say plainly that this is a summary --
          # a truncated changelog that does not admit it is truncated is the
          # exact defect this project exists to remove.
          LIMIT=124000
          if [ "$(wc -c < "$NOTES_FILE")" -gt "$LIMIT" ]; then
            FULL_BYTES="$(wc -c < "$NOTES_FILE")"
            echo "::notice::CHANGELOG section for $VERSION is ${FULL_BYTES} bytes; trimming to fit GitHub's 125000 limit."
            TRIMMED="$(mktemp)"
            head -c "$LIMIT" "$NOTES_FILE" | sed '$d' > "$TRIMMED"
            {
              printf '\n\n---\n\n'
              printf '**This release note is TRUNCATED.** The full %s section is %s characters, past GitHub'"'"'s 125,000 limit for a release body.\n\n' "$VERSION" "$FULL_BYTES"
              printf 'Read the complete entry in [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md).\n' "$GITHUB_REPOSITORY"
            } >> "$TRIMMED"
            mv "$TRIMMED" "$NOTES_FILE"
          fi
          SBOM_ARGS=()
          if [ -f sbom.cdx.json ]; then
            SBOM_ARGS+=(sbom.cdx.json)
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG section for $VERSION — falling back to generated notes."
            gh release create "$TAG" --title "$TAG" --generate-notes --latest "${SBOM_ARGS[@]}" || \
              gh release edit "$TAG" --title "$TAG" --latest
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --latest "${SBOM_ARGS[@]}" || \
              gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --latest
          fi
          if [ ! -s sbom.cdx.json ]; then
            echo "::error::sbom.cdx.json missing or empty after generate-sbom"
            exit 1
          fi
          gh release upload "$TAG" sbom.cdx.json --clobber
