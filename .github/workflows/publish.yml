name: Publish (npm Trusted Publishing)

# Publishes `sf-intelligence` to npm on a version tag push, keyless via OIDC.
# NO NPM TOKEN is used or stored: npm Trusted Publishing exchanges the GitHub
# Actions OIDC identity for a short-lived publish credential, and provenance is
# attached automatically.
#
# ONE-TIME SETUP (npmjs.com, done by the package owner — cannot be automated):
#   npmjs.com -> package `sf-intelligence` -> Settings -> Trusted Publishing
#   -> add a GitHub Actions publisher:
#        Organization/user: PranavNagrecha
#        Repository:        Salesforce-Intelligence
#        Workflow filename: publish.yml
#   (leave Environment blank to match this workflow, or set one and add
#    `environment:` below to match). Must be configured BEFORE pushing the tag,
#    or the publish step fails auth (re-runnable after).
#
# To release: push an annotated tag `vX.Y.Z` whose version matches
# packages/cli/package.json (the prepublishOnly guard enforces the match).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write # create/update the GitHub release for the tag
  id-token: write # npm Trusted Publishing (OIDC) + provenance, and MCP Registry OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the org-leak guard can scan past commits

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Upgrade npm (>= 11.5.1 for OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      # Privacy guard — REFUSE to publish if any real-org identifier or PII
      # slipped into the tree or git history. Mirrors the CI org-leak gate so
      # the tag-triggered publish is self-guarding, not reliant on CI having
      # run separately on the tagged commit. The blocklist of real org terms is
      # kept out of the repo and materialized from the ORG_LEAK_BLOCKLIST secret
      # (absent → the generic structural patterns still run). This step runs
      # BEFORE publish, so a leak fails the job with nothing pushed to npm.
      - name: Privacy guard (org-leak scan + release guard)
        env:
          ORG_LEAK_BLOCKLIST: ${{ secrets.ORG_LEAK_BLOCKLIST }}
        run: |
          if [ -n "$ORG_LEAK_BLOCKLIST" ]; then
            printf '%s' "$ORG_LEAK_BLOCKLIST" > scripts/forbidden-names.local.json
          fi
          node scripts/scan-org-leaks.mjs --strict
          node scripts/scan-org-leaks.mjs --git-history --strict
          pnpm guard
          rm -f scripts/forbidden-names.local.json

      # Idempotent: a re-run (or a workflow_dispatch against an already-released
      # tag) must not fail the whole job just because this version is on npm.
      # The later steps — GitHub release and MCP registry — are the ones that
      # historically drifted, so they need to be reachable on a re-run.
      - name: Publish sf-intelligence (keyless, with provenance)
        working-directory: packages/cli
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "sf-intelligence@${VERSION}" version >/dev/null 2>&1; then
            echo "sf-intelligence@${VERSION} is already on npm — skipping publish."
          else
            npm publish --provenance --access public
          fi

      # Publish the server manifest to the official MCP Registry, keyless via the
      # same GitHub Actions OIDC identity. Previously this was a MANUAL step and
      # so it silently rotted: the registry sat at 0.1.26 while npm was at 0.2.5,
      # and downstream MCP directories crawl the registry record, propagating the
      # stale version across the ecosystem. Automating it here is the fix.
      - name: Publish to the official MCP Registry (keyless OIDC)
        working-directory: packages/cli
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./server.json').version")"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::server.json version ($MANIFEST_VERSION) != package.json version ($VERSION). Bump server.json before tagging."
            exit 1
          fi
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar -xz mcp-publisher
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # AUDIT-F10: CycloneDX SBOM for the published package (release asset only;
      # not shipped inside the npm tarball). Best-effort — a missing npm sbom
      # subcommand must not block publish.
      - name: Generate CycloneDX SBOM (AUDIT-F10)
        working-directory: packages/cli
        run: |
          if npm sbom --help >/dev/null 2>&1; then
            npm sbom --sbom-format cyclonedx > ../../sbom.cdx.json
            echo "Wrote sbom.cdx.json"
          else
            echo "npm sbom unavailable — skipping SBOM artifact"
          fi

      # Cut the GitHub release. This step did not exist before, which is why
      # every previous release had to be created by hand — a tag would publish to
      # npm and GitHub would keep showing an older release as "Latest". Notes are
      # lifted from the matching CHANGELOG section so they cannot drift from it.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) echo "Not a version tag ($TAG) — skipping release."; exit 0 ;;
          esac
          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          # Extract just this version's CHANGELOG section (## [x.y.z] ... next ##).
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          SBOM_ARGS=()
          if [ -f sbom.cdx.json ]; then
            SBOM_ARGS+=(sbom.cdx.json)
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG section for $VERSION — falling back to generated notes."
            gh release create "$TAG" --title "$TAG" --generate-notes --latest "${SBOM_ARGS[@]}" || \
              gh release edit "$TAG" --title "$TAG" --latest
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --latest "${SBOM_ARGS[@]}" || \
              gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --latest
          fi
          if [ -f sbom.cdx.json ]; then
            gh release upload "$TAG" sbom.cdx.json --clobber || true
          fi
