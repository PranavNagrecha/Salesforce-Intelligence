<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="sf-intelligence terminal">
  <rect width="64" height="64" rx="12" fill="#05070A"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="11" fill="none" stroke="#1C3326" stroke-width="1.5"/>
  <!-- scanline hint -->
  <g fill="#0E1A12" opacity="0.6">
    <rect x="4" y="12" width="56" height="1.5"/><rect x="4" y="20" width="56" height="1.5"/>
    <rect x="4" y="28" width="56" height="1.5"/><rect x="4" y="36" width="56" height="1.5"/>
    <rect x="4" y="44" width="56" height="1.5"/><rect x="4" y="52" width="56" height="1.5"/>
  </g>
  <!-- phosphor prompt: >_ -->
  <g fill="none" stroke="#3DF07A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)">
    <polyline points="16,22 28,32 16,42"/>
  </g>
  <rect x="34" y="38" width="16" height="5.5" rx="1" fill="#3DF07A" filter="url(#g)"/>
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
