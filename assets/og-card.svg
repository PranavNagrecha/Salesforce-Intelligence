<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1426"/>
      <stop offset="100%" stop-color="#1F3556"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#00A1E0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00A1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- grid -->
  <g stroke="#1F3556" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <g transform="translate(80,180)">
    <text font-size="16" letter-spacing="4" fill="#00A1E0" font-weight="700">SFINTELLIGENCE</text>

    <text y="80" font-size="76" font-weight="800" fill="#FFFFFF">An intelligence layer</text>
    <text y="160" font-size="76" font-weight="800" fill="#FFFFFF">for your Salesforce org.</text>

    <text y="230" font-size="22" fill="#9BB3D1">Offline. Read-only. MCP-first. MIT + Commons Clause.</text>

    <g transform="translate(0,290)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <text fill="#7E8FAA">›</text>
      <text x="22" fill="#E6EEF8">88 tools · 25+ component types · 17 edge types</text>
    </g>
  </g>

  <g transform="translate(1020,80)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5E7395">
    <text>github.com/your/sf-intelligence</text>
  </g>
</svg>
