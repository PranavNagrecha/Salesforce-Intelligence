<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="1100" height="720" fill="#FAFBFD"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <text x="50" y="48" font-size="13" letter-spacing="2.5" fill="#0176D3" font-weight="700">DEMO · sfi.what_happens_on_save</text>
    <text x="50" y="80" font-size="26" font-weight="700" fill="#181818">The lifecycle narrative, instantiated for your org.</text>
    <text x="50" y="108" font-size="14" fill="#706E6B">Order of execution + Flow + Apex + Workflow + Validation, composed into one timeline.</text>
  </g>

  <g transform="translate(50,140)">
    <rect width="1000" height="540" rx="10" fill="#0B1426"/>
    <circle cx="22" cy="22" r="6" fill="#FF5F57"/>
    <circle cx="42" cy="22" r="6" fill="#FEBC2E"/>
    <circle cx="62" cy="22" r="6" fill="#28C840"/>
    <text x="500" y="27" text-anchor="middle" font-size="12" fill="#7E8FAA">claude  ·  sfi mcp  ·  org-kb @ 2026-05-28</text>
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#1F3556"/>

    <g font-size="13.5" transform="translate(28,76)">
      <text fill="#7FCBFF" font-weight="700">you</text>
      <text x="0" y="22" fill="#E6EEF8">What happens when a sales rep closes an Opportunity in this org?</text>

      <text y="60" fill="#FFA967" font-weight="700">claude</text>
      <text x="0" y="82" fill="#9BB3D1">→ sfi.what_happens_on_save({ object: "Opportunity", operation: "update",</text>
      <text x="0" y="100" fill="#9BB3D1">                              fieldChanges: [{ StageName: "Closed Won" }] })</text>

      <g transform="translate(0,126)" fill="#E6EEF8">
        <text fill="#7FCBFF" font-weight="700">timeline (14 steps)</text>

        <g transform="translate(0,24)">
          <text fill="#7E8FAA">[before save]</text>

          <text y="22" fill="#A4D4A4">1 · </text> <text x="32" y="22">System fields written        </text> <text x="380" y="22" fill="#7E8FAA">Salesforce internal</text>
          <text y="40" fill="#A4D4A4">2 · </text> <text x="32" y="40">Validation rules fired (3)   </text> <text x="380" y="40" fill="#7E8FAA">all pass</text>
          <text y="58" fill="#A4D4A4">3 · </text> <text x="32" y="58">Before-trigger:               </text> <text x="380" y="58" fill="#FFD580">OpportunityTrigger.beforeUpdate</text>
          <text y="76" fill="#A4D4A4">4 · </text> <text x="32" y="76">  → OpportunityHandler.applyClosedWonDefaults()</text>
          <text y="94" fill="#A4D4A4">5 · </text> <text x="32" y="94">Before-save Flow:             </text> <text x="380" y="94" fill="#FFD580">Opp_Set_Renewal_Dates (order 10)</text>

          <text y="124" fill="#7E8FAA">[save]</text>

          <text y="146" fill="#A4D4A4">6 · </text> <text x="32" y="146">Record committed             </text>

          <text y="170" fill="#7E8FAA">[after save]</text>

          <text y="192" fill="#A4D4A4">7 · </text> <text x="32" y="192">After-trigger:                </text> <text x="380" y="192" fill="#FFD580">OpportunityTrigger.afterUpdate</text>
          <text y="210" fill="#A4D4A4">8 · </text> <text x="32" y="210">  → CommissionService.calculate() — async via Queueable</text>
          <text y="228" fill="#A4D4A4">9 · </text> <text x="32" y="228">Record-triggered Flow (after): </text> <text x="380" y="228" fill="#FFD580">Opp_Renewal_Generator (order 20)</text>
          <text y="246" fill="#A4D4A4">10 ·</text> <text x="32" y="246">  → creates Renewal__c record</text>
          <text y="264" fill="#A4D4A4">11 ·</text> <text x="32" y="264">Workflow rule:                </text> <text x="380" y="264" fill="#FFD580">Notify_RevOps_Closed_Won</text>
          <text y="282" fill="#A4D4A4">12 ·</text> <text x="32" y="282">  → email alert to revops@acme.com</text>
          <text y="300" fill="#A4D4A4">13 ·</text> <text x="32" y="300">Approval auto-submission:     </text> <text x="380" y="300" fill="#FFD580">High_Value_Closed_Won_Review</text>
          <text y="318" fill="#7E8FAA">14 ·</text> <text x="32" y="318" fill="#7E8FAA">  → fires only if Amount &gt; $250K (criteria not evaluated)</text>

          <text y="348" fill="#7E8FAA">[post-commit]</text>

          <text y="370" fill="#A4D4A4">→</text> <text x="32" y="370">CDC event OpportunityChangeEvent fires</text>
          <text y="388" fill="#A4D4A4">→</text> <text x="32" y="388">2 subscribers: Marketo sync, Data Warehouse stream</text>
        </g>

        <text y="430" fill="#9BB3D1" font-style="italic">conditions LISTED, not EVALUATED. depth-bound walker, not a runtime simulator.</text>
      </g>
    </g>
  </g>
</svg>
