<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1426"/>
      <stop offset="100%" stop-color="#1A2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00A1E0"/>
      <stop offset="100%" stop-color="#0176D3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00A1E0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00A1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="900" cy="210" r="280" fill="url(#glow)"/>

  <!-- decorative grid -->
  <g stroke="#1F3556" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- floating tool chips on the right -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <g transform="translate(720,70)">
      <rect width="200" height="34" rx="17" fill="#0F2238" stroke="#2A4870"/>
      <text x="20" y="22" fill="#7FCBFF">sfi.field_360</text>
    </g>
    <g transform="translate(940,110)">
      <rect width="230" height="34" rx="17" fill="#0F2238" stroke="#2A4870"/>
      <text x="20" y="22" fill="#7FCBFF">sfi.why_cant_user_see_record</text>
    </g>
    <g transform="translate(760,160)">
      <rect width="220" height="34" rx="17" fill="#0F2238" stroke="#2A4870"/>
      <text x="20" y="22" fill="#7FCBFF">sfi.what_happens_on_save</text>
    </g>
    <g transform="translate(1000,210)">
      <rect width="170" height="34" rx="17" fill="#0F2238" stroke="#2A4870"/>
      <text x="20" y="22" fill="#7FCBFF">sfi.field_lineage</text>
    </g>
    <g transform="translate(720,260)">
      <rect width="210" height="34" rx="17" fill="#0F2238" stroke="#2A4870"/>
      <text x="20" y="22" fill="#7FCBFF">sfi.order_of_execution</text>
    </g>
    <g transform="translate(960,310)">
      <rect width="180" height="34" rx="17" fill="#0F2238" stroke="#2A4870"/>
      <text x="20" y="22" fill="#7FCBFF">sfi.pii_inventory</text>
    </g>
    <g transform="translate(740,360)">
      <rect width="200" height="34" rx="17" fill="#0F2238" stroke="#2A4870"/>
      <text x="20" y="22" fill="#7FCBFF">sfi.find_dead_code</text>
    </g>
  </g>

  <!-- title block -->
  <g transform="translate(70,120)">
    <text font-size="14" letter-spacing="3" fill="#00A1E0" font-weight="600">SFINTELLIGENCE</text>
    <text y="56" font-size="52" font-weight="700" fill="#FFFFFF">An intelligence layer</text>
    <text y="112" font-size="52" font-weight="700" fill="#FFFFFF">for your Salesforce org.</text>

    <text y="168" font-size="18" fill="#9BB3D1">88 MCP tools. 17 edge types. 25+ component types.</text>
    <text y="194" font-size="18" fill="#9BB3D1">Offline, read-only, deterministic. MIT + Commons Clause.</text>

    <g transform="translate(0,230)">
      <rect width="220" height="44" rx="22" fill="url(#accent)"/>
      <text x="110" y="29" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Ask anything about your org</text>
    </g>
  </g>
</svg>
